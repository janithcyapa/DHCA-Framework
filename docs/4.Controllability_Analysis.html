      function __resizeIframe(obj) {
        const scrollbarHeight = 20; // Max between windows, mac, and linux

        function setHeight() {
          // Guard against race condition where iframe isn't ready
          if (!obj.contentWindow?.document?.documentElement) {
            return;
          }
          const element = obj.contentWindow.document.documentElement;
          // If there is no vertical scrollbar, we don't need to resize the iframe
          if (element.scrollHeight === element.clientHeight) {
            return;
          }

          // Create a new height that includes the scrollbar height if it's visible
          const hasHorizontalScrollbar = element.scrollWidth > element.clientWidth;
          const newHeight = element.scrollHeight + (hasHorizontalScrollbar ? scrollbarHeight : 0);

          // Only update the height if it's different from the current height
          if (obj.style.height !== `${newHeight}px`) {
            obj.style.height = `${newHeight}px`;
          }
        }

        // Resize the iframe to the height of the content and bottom scrollbar height
        setHeight();

        // Resize the iframe when the content changes
        const resizeObserver = new ResizeObserver((_entries) => {
          setHeight();
        });
        // Only observe if iframe content is ready
        if (obj.contentWindow?.document?.body) {
          resizeObserver.observe(obj.contentWindow.document.body);
        }
      }
    </script>

/* Font and Radius Variables */

:root {
    /* Light Mode (Default) */
    --background: #ffffff;
    --background-darker: #e5e5e5;
    --foreground: #0a0a0a;
    --muted: #f0f0f0;
    --muted-foreground: #777777;

    --card: #fafafa;
    --card-foreground: #222222;
    --popover: #e8e8e8;
    --popover-foreground: #0f0f0f;
    --border: #444444;

    --primary: #1e40af;
    --primary-foreground: #ffffff;
    --secondary: #475569;
    --secondary-foreground: #ffffff;
    --accent: #f97316;
    --accent-foreground: #ffffff;

    --h1-color: #1f2937; 
    --h2-color: #374151; 
    --h3-color: #4b5563; 

    --inline-code-color: #2563eb;
    --equation-color: #6b7280;

    --error: #dc2626;
    --success: #059669;
    --destructive: #b91c1c;
    --action: #d97706;
    --link: #2563eb;
    --link-visited: #7c3aed;

    --base-shadow: rgba(0, 0, 0, 0.08);
    --base-shadow-darker: rgba(0, 0, 0, 0.12);
    --base-shadow-opacity: 8%;
}

/* Dark Mode Overrides (Handles both System Preference and Manual Toggle) */
@media (prefers-color-scheme: dark) {
    :root:not(.light) {
        --background: #181a1c;
        --background-darker: #101214;
        --foreground: #eef2f5;

        --h1-color: #e5e7eb;

/* =========================================

   ========================================= */

:root, :root.dark, :root[data-theme="dark"] {
    /* 1. Nuke Marimo's default greenish-slate palette */
    --slate-1: #111111 !important;
    --slate-2: #161616 !important;
    --slate-3: #1c1c1c !important;
    --slate-4: #232323 !important;
    --slate-5: #2e2e2e !important;

    --slate-7: #505050 !important;
    --slate-8: #707070 !important;

    --slate-10: #d4d4d4 !important;
    --slate-11: #e5e5e5 !important;
    --slate-12: #f5f5f5 !important;

    /* 2. Force Glide Data Grid variables to use your theme's grays */
    --gdg-bg-cell: #181a1c !important;

    --gdg-bg-header: #101214 !important;

    --gdg-text-dark: #eef2f5 !important;
    --gdg-text-header: #9ca3af !important;
    --gdg-border-color: #2e3236 !important;
    --gdg-horizontal-border-color: #2e3236 !important;
    --gdg-accent-color: #3b82f6 !important; /* Blue selection ring */
}

/* Light Mode Overrides */
@media (prefers-color-scheme: light) {
    :root:not(.dark):not([data-theme="dark"]) {

        --gdg-text-header: #4b5563 !important;
        --gdg-border-color: #444444 !important;
        --gdg-horizontal-border-color: #444444 !important;
    }
}

    margin-top: 1.2em;
    margin-bottom: 0.5em;

}

child(even) td {\n    background-color: transparent !important;\n}\n\n/* Hover effect - Also applied to the TD */\n:root body [class*=\"prose\"] tbody tr:hover td,\nmarimo-markdown tbody tr:hover td {\n    background-color: var(--background-darker) !important;\n}\n\n/* =========================================\n   Markdown Blockquote Callouts (No HTML/Python needed)\n   ========================================= */\n\n/* Base style for ALL blockquotes (Standard Notes) */\n.prose blockquote, marimo-markdown blockquote {\n    padding: 16px !important;\n    margin: 1.5em 0 !important;\n    border-radius: 0 var(--radius) var(--radius) 0 !important;\n    border-left: 4px solid var(--secondary) !important;\n    background-color: var(--muted) !important;\n    box-shadow: var(--base-shadow) !important;\n    font-style: normal !important; /* Removes the default italic text */\n    color: var(--foreground) !important;\n}\n\n/* Remove awkward spacing at the top of the box */\n.prose blockquote \u003E :first-child, marimo-markdown blockquote \u003E :first-child {\n    margin-top: 0 !important;\n}\n\n/* 1. Definitions -\u003E Triggered by #### (H4) */\n.prose blockquote:has(h4), marimo-markdown blockquote:has(h4) {\n    border-left-color: var(--primary) !important;\n    background-color: light-dark(rgba(30, 64, 175, 0.06), rgba(59, 130, 246, 0.08)) !important;\n}\n\n/* 2. Theorems -\u003E Triggered by ##### (H5) */\n.prose blockquote:has(h5), marimo-markdown blockquote:has(h5) {\n    border-left-color: var(--accent) !important;\n    background-color: light-dark(rgba(249, 115, 22, 0.08), rgba(251, 146, 60, 0.08)) !important;\n}\n\n/* 3. Examples -\u003E Triggered by ###### (H6) */\n.prose blockquote:has(h6), marimo-markdown blockquote:has(h6) {\n    border-left-color: var(--success) !important;\n    background-color: light-dark(rgba(5, 150, 105, 0.06), rgba(52, 211, 153, 0.06)) !important;\n}\n\n/* Force the H6 Example title to be green instead of gray */\n.prose blockquote h6, marimo-markdown blockquote h6 {\n    color: var(--success) !important;\n    font-size: 1.1em !important;\n    font-weight: 600 !important;\n    letter-spacing: -0.01em !important;\n}\n\u003C/style\u003E"}, "type": "data"}]}, {"code_hash": "ec7a87e87bf009e0e6c495bd181c1280", "console": [], "id": "MJUe", "outputs": [{"data": {"text/markdown": "\u003Cspan class=\"markdown prose dark:prose-invert contents\"\u003E\u003Ch1 id=\"controllability-analysis\"\u003E\u003Cstrong\u003EControllability Analysis\u003C/strong\u003E\u003C/h1\u003E\u003C/span\u003E"}, "type": "data"}]}, {"code_hash": "89ba6e1a370baca785ff12bc8958e3ae", "console": [], "id": "vblA", "outputs": [{"data": {"text/markdown": "\u003Cspan class=\"markdown prose dark:prose-invert contents\"\u003E\u003Ch2 id=\"define-requirements\"\u003E\u003Cstrong\u003EDefine Requirements\u003C/strong\u003E\u003C/h2\u003E\u003C/span\u003E"}, "type": "data"}]}, {"code_hash": "63f7819616bbd1ab030a204d012ee586", "console": [], "id": "bkHC", "outputs": [{"data": {"text/markdown": "\u003Cspan class=\"markdown prose dark:prose-invert contents\"\u003E\u003Cspan class=\"paragraph\"\u003ESince there is only one control input (\u003Cmarimo-tex class=\"arithmatex\"\u003E||(u = \\dot{V}_s||)\u003C/marimo-tex\u003E) acting on three states (\u003Cmarimo-tex class=\"arithmatex\"\u003E||(T_{in}, W_{in}, C_{in}||)\u003C/marimo-tex\u003E), the system cannot track arbitrary setpoints for all three simultaneously. However, it can maintain all three within defined bounded regions if their acceptable control limits overlap.\u003C/span\u003E\u003C/span\u003E"}, "type": "data"}]}, {"code_hash": "f5bb43d07af1598f9e6f67f5411c5323", "console": [], "id": "lEQa", "outputs": [{"data": {"text/markdown": "\u003Cspan class=\"markdown prose dark:prose-invert contents\"\u003E\u003Ch3 id=\"target-hvac-design-parameters\"\u003ETarget HVAC Design Parameters\u003C/h3\u003E\n\u003Cspan class=\"paragraph\"\u003EBased on \u003Cstrong\u003EASHRAE Standard 55\u003C/strong\u003E (Thermal Environmental Conditions for Human Occupancy) and \u003Cstrong\u003EASHRAE Standard 62.1\u003C/strong\u003E (Ventilation for Acceptable Indoor Air Quality).\u003C/span\u003E\n\u003Ctable\u003E\n\u003Cthead\u003E\n\u003Ctr\u003E\n\u003Cth\u003EParameter\u003C/th\u003E\n\u003Cth\u003ERecommended Comfort Range\u003C/th\u003E\n\u003Cth\u003EHard Limits / System Capacity\u003C/th\u003E\n\u003Cth\u003EStandard\u003C/th\u003E\n\u003C/tr\u003E\n\u003C/thead\u003E\n\u003Ctbody\u003E\n\u003Ctr\u003E\n\u003Ctd\u003E\u003Cstrong\u003EOperative Temperature\u003C/strong\u003E\u003C/td\u003E\n\u003Ctd\u003E\u003Cstrong\u003E23\u00b0C to 26\u00b0C\u003C/strong\u003E (Summer/Cooling) \u003Cbr/\u003E\u003Cstrong\u003E20\u00b0C to 23.5\u00b0C\u003C/strong\u003E (Winter/Heating)\u003C/td\u003E\n\u003Ctd\u003E\u003Cstrong\u003E18\u00b0C to 28\u00b0C\u003C/strong\u003E\u003C/td\u003E\n\u003Ctd\u003EASHRAE 55\u003C/td\u003E\n\u003C/tr\u003E\n\u003Ctr\u003E\n\u003Ctd\u003E\u003Cstrong\u003ERelative Humidity (RH)\u003C/strong\u003E\u003C/td\u003E\n\u003Ctd\u003E\u003Cstrong\u003E30% to 60%\u003C/strong\u003E\u003C/td\u003E\n\u003Ctd\u003E\u003Cstrong\u003EMaximum 65%\u003C/strong\u003E\u003C/td\u003E\n\u003Ctd\u003EASHRAE 55\u003C/td\u003E\n\u003C/tr\u003E\n\u003Ctr\u003E\n\u003Ctd\u003E\u003Cstrong\u003ECarbon Dioxide (CO2)\u003C/strong\u003E\u003C/td\u003E\n\u003Ctd\u003E\u003Cstrong\u003E\u0026lt; 1000 ppm\u003C/strong\u003E\u003C/td\u003E\n\u003Ctd\u003E\u003Cstrong\u003EOutdoor Ambient + 700 ppm\u003C/strong\u003E\u003C/td\u003E\n\u003Ctd\u003EASHRAE 62.1\u003C/td\u003E\n\u003C/tr\u003E\n\u003C/tbody\u003E\n\u003C/table\u003E\n\u003Cul\u003E\n\u003Cli\u003ETherefore, the system should actively ventilate to keep indoor CO2 under \u003Cstrong\u003E1000 to 1100 ppm\u003C/strong\u003E.\u003C/li\u003E\n\u003C/ul\u003E\n\u003Cspan class=\"paragraph\"\u003EIntroducing fresh outside air inevitably brings in unconditioned, often humid air, introducing disturbances that your controller's state estimator will need to account for to maintain the thermal equilibrium of the space.\u003C/span\u003E\n\u003Cspan class=\"paragraph\"\u003EAre you planning to control the fresh air intake dampers actively based on CO2 sensor feedback, or will the system rely on a fixed minimum ventilation rate?\u003C/span\u003E\u003C/span\u003E"}, "type": "data"}]}, {"code_hash": "bb3d01c398c29f072a91296b39c7577e", "console": [], "id": "PKri", "outputs": [{"data": {"text/markdown": "\u003Cspan class=\"markdown prose dark:prose-invert contents\"\u003E\u003Ch2 id=\"viability-and-control-set-invariance\"\u003E\u003Cstrong\u003EViability and Control Set Invariance\u003C/strong\u003E\u003C/h2\u003E\u003C/span\u003E"}, "type": "data"}]}, {"code_hash": "f380816c03471cbdb257420007f9bda2", "console": [], "id": "Xref", "outputs": [{"data": {"text/markdown": "\u003Cspan class=\"markdown prose dark:prose-invert contents\"\u003E\u003Ch3 id=\"system-dynamics\"\u003ESystem Dynamics\u003C/h3\u003E\u003C/span\u003E"}, "type": "data"}]}, {"code_hash": "39b623557d9b09f2a2fe8aaac594ee5e", "console": [], "id": "SFPL", "outputs": [{"data": {"text/markdown": "\u003Cspan class=\"markdown prose dark:prose-invert contents\"\u003E\u003Cspan class=\"paragraph\"\u003EFrom previos system modeling,\u003C/span\u003E\n\u003Cmarimo-tex class=\"arithmatex\"\u003E||[C_{\\text{air}} \\ \\dot{T}_{in}=\n\\frac{T_{\\text{out}} - T_{in}}{R_{\\text{env,external}}} +\nN_{occ}\u22c5q_{person}+\n\\rho_{air} \\dot{V}_{s} \\ c_p \\ (T_s - T_{in}) +\nd_{T} ||]\u003C/marimo-tex\u003E\u003Cmarimo-tex class=\"arithmatex\"\u003E||[M_{air}\\ \\dot{W}_{in} =\nN_{occ} \u22c5g_{w,person} +\n\\rho_{air} \\dot{V}_{s} (W_s - W_{in}) +\nd_{W} ||]\u003C/marimo-tex\u003E\u003Cmarimo-tex class=\"arithmatex\"\u003E||[V_{room}  \\ \\dot{C}_{in} =\nN_{occ}\u22c5g_{co2,person} +\n\\dot{V}_{s}(C_{s} - C_{in}) +\nd_{C} ||]\u003C/marimo-tex\u003E\u003Cspan class=\"paragraph\"\u003E\u003Cem\u003ENote: For numerical consistency, \u003Cmarimo-tex class=\"arithmatex\"\u003E||(C||)\u003C/marimo-tex\u003E is expressed as a volumetric fraction (m\u00b3 CO\u2082 / m\u00b3 air) in the ODE.\nConversion: \u003Cmarimo-tex class=\"arithmatex\"\u003E||(C_{\\text{frac}} = C_{\\text{ppm}} \\times 10^{-6}||)\u003C/marimo-tex\u003E. The generation rate \u003Cmarimo-tex class=\"arithmatex\"\u003E||(g_{co2,person}||)\u003C/marimo-tex\u003E is then in m\u00b3/s\u00b7person.\u003C/em\u003E\u003C/span\u003E\n\u003Cmarimo-tex class=\"arithmatex\"\u003E||[u = V_{s,i} \\in [0, u_{max}]||]\u003C/marimo-tex\u003E\u003C/span\u003E"}, "type": "data"}]}, {"code_hash": "76cdb2030cfdc1ff6edd3d8378b49740", "console": [], "id": "BYtC", "outputs": [{"data": {"text/markdown": "\u003Cspan class=\"markdown prose dark:prose-invert contents\"\u003E\u003Ch3 id=\"constraint-set\"\u003EConstraint Set\u003C/h3\u003E\u003C/span\u003E"}, "type": "data"}]}, {"code_hash": "fb0446b1946e98225211dab795b79d97", "console": [], "id": "RGSE", "outputs": [{"data": {"text/markdown": "\u003Cspan class=\"markdown prose dark:prose-invert contents\"\u003E\u003Cspan class=\"paragraph\"\u003EConsidering three states of the system, and the ASHRE standard define the acceptable comfort region as a polytope \u003Cmarimo-tex class=\"arithmatex\"\u003E||(X \\subset \\mathbb{R}^{3}||)\u003C/marimo-tex\u003E specified by six inequalities.\u003C/span\u003E\n\u003Cul\u003E\n\u003Cli\u003ETemperature upper bound - \u003Cmarimo-tex class=\"arithmatex\"\u003E||(T_{in} \\le T_{set} + \\Delta T||)\u003C/marimo-tex\u003E\u003C/li\u003E\n\u003Cli\u003ETemperature lower bound - \u003Cmarimo-tex class=\"arithmatex\"\u003E||(T_{in} \\ge T_{set} - \\Delta T||)\u003C/marimo-tex\u003E\u003C/li\u003E\n\u003Cli\u003EHumidity upper bound - \u003Cmarimo-tex class=\"arithmatex\"\u003E||(W_{in} \\le W_{max}||)\u003C/marimo-tex\u003E\u003C/li\u003E\n\u003Cli\u003EHumidity lower bound - \u003Cmarimo-tex class=\"arithmatex\"\u003E||(W_{in} \\ge W_{min}||)\u003C/marimo-tex\u003E\u003C/li\u003E\n\u003Cli\u003E\u003Cmarimo-tex class=\"arithmatex\"\u003E||(CO_2||)\u003C/marimo-tex\u003E upper bound - \u003Cmarimo-tex class=\"arithmatex\"\u003E||(C_{in} \\le C_{max}||)\u003C/marimo-tex\u003E\u003C/li\u003E\n\u003Cli\u003E\u003Cmarimo-tex class=\"arithmatex\"\u003E||(CO_2||)\u003C/marimo-tex\u003E lower bound - \u003Cmarimo-tex class=\"arithmatex\"\u003E||(C_{in} \\ge C_{env}||)\u003C/marimo-tex\u003E\u003C/li\u003E\n\u003C/ul\u003E\n\u003Cspan class=\"paragraph\"\u003EIn here, \u003Cmarimo-tex class=\"arithmatex\"\u003E||(\\Delta T||)\u003C/marimo-tex\u003E is the accetable deviation from temperature setpoint.And there is also,\u003C/span\u003E\n\u003Cul\u003E\n\u003Cli\u003Esaturation constraints of supply - \u003Cmarimo-tex class=\"arithmatex\"\u003E||(u \\le u_{max}||)\u003C/marimo-tex\u003E\u003C/li\u003E\n\u003C/ul\u003E\u003C/span\u003E"}, "type": "data"}]}, {"code_hash": "12de59eb3a077e8e8fcb14fce6f064cd", "console": [], "id": "Kclp", "outputs": [{"data": {"text/markdown": "\u003Cspan class=\"markdown prose dark:prose-invert contents\"\u003E\u003Ch3 id=\"apply-conditions-at-constraint-boundary-by-nagumos-theorem\"\u003EApply Conditions at Constraint Boundary by Nagumo's theorem\u003C/h3\u003E\u003C/span\u003E"}, "type": "data"}]}, {"code_hash": "d811bdc5d155766c064a73c01c13272c", "console": [], "id": "emfo", "outputs": [{"data": {"text/markdown": "\u003Cspan class=\"markdown prose dark:prose-invert contents\"\u003E\u003Cspan class=\"paragraph\"\u003EREF: \u003Ca href=\"https://www.emergentmind.com/topics/nagumo-type-invariance-condition\" rel=\"noopener noreferrer\" target=\"_blank\"\u003Ehttps://www.emergentmind.com/topics/nagumo-type-invariance-condition\u003C/a\u003E\u003C/span\u003E\n\u003Cspan class=\"paragraph\"\u003EBy , the set \u003Cmarimo-tex class=\"arithmatex\"\u003E||(X||)\u003C/marimo-tex\u003E is a Control Invariant Set if and only if at every boundary face there exists an admissible \u003Cmarimo-tex class=\"arithmatex\"\u003E||(u \\in [0, u_{max}]||)\u003C/marimo-tex\u003E such that the system vector field points strictly inward.\u003C/span\u003E\n\u003Cspan class=\"paragraph\"\u003ETherefore, Lie derivative \u003Cmarimo-tex class=\"arithmatex\"\u003E||(h_k = \\nabla h_k \\cdot f(x,u) \\le 0||)\u003C/marimo-tex\u003E at each constraint.\u003C/span\u003E\n\u003Cspan class=\"paragraph\"\u003EConsidering the temperature upper bound define barrier funtions,\u003C/span\u003E\n\u003Cmarimo-tex class=\"arithmatex\"\u003E||[h_1 = T_{in} - ( T_{set} + \\Delta T) \\le 0||]\u003C/marimo-tex\u003E\u003Cspan class=\"paragraph\"\u003EThen,\u003C/span\u003E\n\u003Cmarimo-tex class=\"arithmatex\"\u003E||[\\nabla h_1 = \\frac{\\partial}{\\partial T_{in}} (T_{in} - ( T_{set} + \\Delta T)) = 1||]\u003C/marimo-tex\u003E\u003Cmarimo-tex class=\"arithmatex\"\u003E||[\\dot{T}_{in} = \\frac{1}{C_{air}} \\left[ \\frac{T_{out} - T_{in}}{R_{env}} + N_{occ} \\cdot q_{person} + \\rho_{air} u c_p (T_s - T_{in}) + d_T \\right]||]\u003C/marimo-tex\u003E\u003Cspan class=\"paragraph\"\u003ETherefore by subsituting these question to Lie derivative condition at \u003Cmarimo-tex class=\"arithmatex\"\u003E||(T_{in} = ( T_{set} + \\Delta T)||)\u003C/marimo-tex\u003E,\u003C/span\u003E\n\u003Cmarimo-tex class=\"arithmatex\"\u003E||[\\frac{1}{C_{air}} \\left[ \\frac{T_{out} - ( T_{set} + \\Delta T)}{R_{env}} + N_{occ} \\cdot q_{person} + \\rho_{air} u c_p (T_s - ( T_{set} + \\Delta T)) + d_T \\right] \\le 0||]\u003C/marimo-tex\u003E\u003Cmarimo-tex class=\"arithmatex\"\u003E||[\\rho_{air} u c_p (T_s - ( T_{set} + \\Delta T)) \\le -\\left( \\frac{T_{out} - ( T_{set} + \\Delta T)}{R_{env}} + N_{occ} \\cdot q_{person} + d_T \\right)||]\u003C/marimo-tex\u003E\u003Cblockquote\u003E\n\u003Cspan class=\"paragraph\"\u003EAssume, \u003Cmarimo-tex class=\"arithmatex\"\u003E||(T_s \u0026lt; ( T_{set} + \\Delta T)||)\u003C/marimo-tex\u003E (supply air is cooler than the upper setpoint), the term \u003Cmarimo-tex class=\"arithmatex\"\u003E||((T_s - ( T_{set} + \\Delta T))||)\u003C/marimo-tex\u003E is negative\u003C/span\u003E\n\u003C/blockquote\u003E\n\u003Cmarimo-tex class=\"arithmatex\"\u003E||[u \\ge \\left( \\frac{\\frac{T_{out} - ( T_{set} + \\Delta T)}{R_{env}} + N_{occ} \\cdot q_{person} + d_T}{\\rho_{air} c_p (( T_{set} + \\Delta T)- T_s)} \\right)||]\u003C/marimo-tex\u003E\u003C/span\u003E"}, "type": "data"}]}, {"code_hash": "08f6f9fd8c8351ee762f7d4fd3f41f12", "console": [], "id": "Hstk", "outputs": [{"data": {"text/markdown": "\u003Cspan class=\"markdown prose dark:prose-invert contents\"\u003E\u003Cblockquote\u003E\n\u003Ch4 id=\"assumptions\"\u003EAssumptions\u003C/h4\u003E\n\u003C/blockquote\u003E\n\u003Cul\u003E\n\u003Cli\u003ESensible Cooling Capacity (\u003Cmarimo-tex class=\"arithmatex\"\u003E||(T_s \u0026lt; T_{hi}||)\u003C/marimo-tex\u003E) - The supply air temperature must be colder than the upper  limit to provide effective sensible cooling.\u003C/li\u003E\n\u003Cli\u003ECooling Mode Operation (\u003Cmarimo-tex class=\"arithmatex\"\u003E||(T_{out} \u0026gt; T_{lo}||)\u003C/marimo-tex\u003E) - Assumes the building is in cooling mode, where environmental heat flux is positive (this assumption would require inversion in winter/heating-dominated climates).\u003C/li\u003E\n\u003Cli\u003EDehumidification Capacity (\u003Cmarimo-tex class=\"arithmatex\"\u003E||(W_s \u0026lt; W_{max}||)\u003C/marimo-tex\u003E) - The AHU cooling coil must be sufficiently sized to deliver supply air humidity below the indoor limit.\u003C/li\u003E\n\u003Cli\u003EPrevention of Over-drying (\u003Cmarimo-tex class=\"arithmatex\"\u003E||(W_s \u0026gt; W_{min}||)\u003C/marimo-tex\u003E) - The supply air must be wetter than the 30% RH lower limit to prevent over-drying.\u003C/li\u003E\n\u003Cli\u003EFresh Air Assumption (\u003Cmarimo-tex class=\"arithmatex\"\u003E||(C_s \u0026lt; C_{max}||)\u003C/marimo-tex\u003E) - The supply air must be fresher than the maximum indoor \u003Cmarimo-tex class=\"arithmatex\"\u003E||(CO_2||)\u003C/marimo-tex\u003E threshold.\u003C/li\u003E\n\u003Cli\u003EOccupant Presence (\u003Cmarimo-tex class=\"arithmatex\"\u003E||(N_{occ} \u0026gt; 0||)\u003C/marimo-tex\u003E) - The environmental lower bound for \u003Cmarimo-tex class=\"arithmatex\"\u003E||(CO_2||)\u003C/marimo-tex\u003E is only active when occupants are present to generate \u003Cmarimo-tex class=\"arithmatex\"\u003E||(CO_2||)\u003C/marimo-tex\u003E.\u003C/li\u003E\n\u003Cli\u003EActuator Physicality (\u003Cmarimo-tex class=\"arithmatex\"\u003E||(u_{max} \u0026gt; 0||)\u003C/marimo-tex\u003E) - The system assumes a positive, non-zero mechanical fan capacity, defining the upper physical limit for the control input.\u003C/li\u003E\n\u003C/ul\u003E\u003C/span\u003E"}, "type": "data"}]}, {"code_hash": "e1fa303cd819690b86cd258989f5d594", "console": [], "id": "nWHF", "outputs": [{"data": {"text/markdown": "\u003Cspan class=\"markdown prose dark:prose-invert contents\"\u003E\u003Cspan class=\"paragraph\"\u003EThen we can derive other constraints for u,\nTemperature bound,\u003C/span\u003E\n\u003Cmarimo-tex class=\"arithmatex\"\u003E||[u \\ge u_{T,min} =  \\frac{\\frac{T_{out} - ( T_{set} + \\Delta T)}{R_{env}} + N_{occ} \\cdot q_{person} + d_T}{\\rho_{air} c_p (( T_{set} + \\Delta T)- T_s)} ||]\u003C/marimo-tex\u003E\u003Cmarimo-tex class=\"arithmatex\"\u003E||[u \\le u_{T,max} = \\frac{\\frac{T_{out} - (T_{set} - \\Delta T)}{R_{env}} + N_{occ} \\cdot q_{person} + d_T}{\\rho_{air} c_p ((T_{set} - \\Delta T) - T_s)}||]\u003C/marimo-tex\u003E\u003Cspan class=\"paragraph\"\u003EHumidity bouds,\u003C/span\u003E\n\u003Cmarimo-tex class=\"arithmatex\"\u003E||[u \\ge u_{W,max} = \\frac{N_{occ} g_w + d_W/M_{air}}{\\rho_{air} (W_{max} - W_s)}||]\u003C/marimo-tex\u003E\u003Cmarimo-tex class=\"arithmatex\"\u003E||[u \\le u_{W,min} = \\frac{N_{occ} g_w + d_W/M_{air}}{\\rho_{air} (W_{min} - W_s)}||]\u003C/marimo-tex\u003E\u003Cspan class=\"paragraph\"\u003E\u003Cmarimo-tex class=\"arithmatex\"\u003E||(CO_2||)\u003C/marimo-tex\u003E Bounds,\u003C/span\u003E\n\u003Cmarimo-tex class=\"arithmatex\"\u003E||[u \\ge u_{CO2} = \\frac{N_{occ} g_{co2} + d_C}{C_{max} - C_s}||]\u003C/marimo-tex\u003E\u003Cspan class=\"paragraph\"\u003ESaturation Bound,\u003C/span\u003E\n\u003Cmarimo-tex class=\"arithmatex\"\u003E||[u \\le u_{max}||]\u003C/marimo-tex\u003E\u003Cspan class=\"paragraph\"\u003ENote: When derive the \u003Cmarimo-tex class=\"arithmatex\"\u003E||(CO_2||)\u003C/marimo-tex\u003E lower bound is proven to be  naturally invariant regardless of  \u003Cmarimo-tex class=\"arithmatex\"\u003E||(u||)\u003C/marimo-tex\u003E,  \u003Cmarimo-tex class=\"arithmatex\"\u003E||(\\frac{N_{occ} g_{co2} + d_C}{V_{room}} \\ge 0||)\u003C/marimo-tex\u003E.\u003C/span\u003E\u003C/span\u003E"}, "type": "data"}]}, {"code_hash": "c9c64ec21c114458813a0b90c2472b43", "console": [], "id": "iLit", "outputs": [{"data": {"text/markdown": "\u003Cspan class=\"markdown prose dark:prose-invert contents\"\u003E\u003Cspan class=\"paragraph\"\u003ECollecting all barrier bounds, the system is simultaneously viable if and only if there exists \u003Cmarimo-tex class=\"arithmatex\"\u003E||(u \\in [0, u_{max}]||)\u003C/marimo-tex\u003E such that all constraints are met.\u003C/span\u003E\n\u003Cmarimo-tex class=\"arithmatex\"\u003E||[u_{lo} = \\max(u_{CO2}, u_{W,max}, u_{T,min})||]\u003C/marimo-tex\u003E\u003Cmarimo-tex class=\"arithmatex\"\u003E||[u_{hi} = \\min(u_{T,max}, u_{W,min}, u_{max})||]\u003C/marimo-tex\u003E\u003Cspan class=\"paragraph\"\u003EAll three quantities (\u003Cmarimo-tex class=\"arithmatex\"\u003E||(T_{in}||)\u003C/marimo-tex\u003E, \u003Cmarimo-tex class=\"arithmatex\"\u003E||(W_{in}||)\u003C/marimo-tex\u003E, \u003Cmarimo-tex class=\"arithmatex\"\u003E||(C_{in}||)\u003C/marimo-tex\u003E) can be simultaneously kept within bounds if and only if,\u003C/span\u003E\n\u003Cmarimo-tex class=\"arithmatex\"\u003E||[u_{lo} \\le u_{hi}||]\u003C/marimo-tex\u003E\u003Cspan class=\"paragraph\"\u003EWhen this holds, any controller that selects \u003Cmarimo-tex class=\"arithmatex\"\u003E||(u(t) \\in [u_{lo}, u_{hi}]||)\u003C/marimo-tex\u003E at each instant guarantees \u003Cmarimo-tex class=\"arithmatex\"\u003E||(X||)\u003C/marimo-tex\u003E is positively invariant. The viability condition \u003Cmarimo-tex class=\"arithmatex\"\u003E||(u_{lo} \\le u_{hi}||)\u003C/marimo-tex\u003E can fail in two qualitatively different ways.\u003C/span\u003E\n\u003Col\u003E\n\u003Cli\u003ECase A: \u003Cmarimo-tex class=\"arithmatex\"\u003E||(u_{lo} \u0026gt; u_{hi}||)\u003C/marimo-tex\u003E\u003C/li\u003E\n\u003C/ol\u003E\n\u003Cspan class=\"paragraph\"\u003EVentilation + dehumidification requirement exceeds the maximum airflow permitted by the temperature lower bound.\u003C/span\u003E\n\u003Cmarimo-tex class=\"arithmatex\"\u003E||[\\max(u_{CO2}, u_{W,max}, u_{T,min}) \u0026gt; u_{T,max} \\tag{22}||]\u003C/marimo-tex\u003E\u003Col start=\"3\"\u003E\n\u003Cli\u003ECase B: \u003Cmarimo-tex class=\"arithmatex\"\u003E||(u_{lo} \u0026gt; u_{max}||)\u003C/marimo-tex\u003E (System capacity exceeded)\u003C/li\u003E\n\u003C/ol\u003E\n\u003Cspan class=\"paragraph\"\u003ETf \u003Cmarimo-tex class=\"arithmatex\"\u003E||(u_{lo}||)\u003C/marimo-tex\u003E exceeds the physical fan capacity \u003Cmarimo-tex class=\"arithmatex\"\u003E||(u_{max}||)\u003C/marimo-tex\u003E, no control action can satisfy the constraints. This happens when the building load is extremely high for HVAC system.\u003C/span\u003E\u003C/span\u003E"}, "type": "data"}]}, {"code_hash": "91c0761a80931d5ef8aae93d750820dd", "console": [], "id": "ZHCJ", "outputs": [{"data": {"text/markdown": "\u003Cspan class=\"markdown prose dark:prose-invert contents\"\u003E\u003Ch2 id=\"conditioning-both-humidity-and-co2\"\u003E\u003Cstrong\u003EConditioning Both Humidity and CO2\u003C/strong\u003E\u003C/h2\u003E\u003C/span\u003E"}, "type": "data"}]}, {"code_hash": "df33da5dffbe1e760d2c61dcc449bc95", "console": [], "id": "ROlb", "outputs": [{"data": {"text/markdown": "\u003Cspan class=\"markdown prose dark:prose-invert contents\"\u003E\u003Cspan class=\"paragraph\"\u003EAssume under the condition wheere \u003Cmarimo-tex class=\"arithmatex\"\u003E||(Co_2||)\u003C/marimo-tex\u003E and humidity distabnaces are negligibale, then both \u003Cmarimo-tex class=\"arithmatex\"\u003E||(u_{CO2}||)\u003C/marimo-tex\u003E and \u003Cmarimo-tex class=\"arithmatex\"\u003E||(u_{W,max}||)\u003C/marimo-tex\u003E scale linearly with \u003Cmarimo-tex class=\"arithmatex\"\u003E||(N_{occ}||)\u003C/marimo-tex\u003E. Then ratio of,\u003C/span\u003E\n\u003Cmarimo-tex class=\"arithmatex\"\u003E||[\\frac{u_{CO2}}{u_{W,max}} = \\left( \\frac{N_{occ} \\cdot g_{co2}}{C_{max} - C_s} \\right) \\cdot \\left( \\frac{\\rho_{air} (W_{max} - W_s)}{N_{occ} \\cdot g_w} \\right)||]\u003C/marimo-tex\u003E\u003Cmarimo-tex class=\"arithmatex\"\u003E||[\\frac{u_{CO2}}{u_{W,max}} = \\frac{g_{co2} \\cdot \\rho_{air} \\cdot (W_{max} - W_s)}{g_w \\cdot (C_{max} - C_s)}||]\u003C/marimo-tex\u003E\u003Cspan class=\"paragraph\"\u003ETake Supply Humidity (\u003Cmarimo-tex class=\"arithmatex\"\u003E||(W_s^*||)\u003C/marimo-tex\u003E), is the value at which the \u003Cmarimo-tex class=\"arithmatex\"\u003E||(CO_2||)\u003C/marimo-tex\u003E ventilation requirement and the humidity dehumidification requirement are exactly equal\u003C/span\u003E\n\u003Cmarimo-tex class=\"arithmatex\"\u003E||[u_{CO2} = u_{W,max}||]\u003C/marimo-tex\u003E\u003Cmarimo-tex class=\"arithmatex\"\u003E||[\\frac{N_{occ} \\cdot g_{co2}}{C_{max} - C_s} = \\frac{N_{occ} \\cdot g_w}{\\rho_{air} (W_{max} - W_s^*)}||]\u003C/marimo-tex\u003E\u003Cmarimo-tex class=\"arithmatex\"\u003E||[g_{co2} \\cdot \\rho_{air} \\cdot (W_{max} - W_s^*) = g_w \\cdot (C_{max} - C_s)||]\u003C/marimo-tex\u003E\u003Cmarimo-tex class=\"arithmatex\"\u003E||[W_s^* = W_{max} - \\frac{g_w \\cdot (C_{max} - C_s)}{\\rho_{air} \\cdot g_{co2}}||]\u003C/marimo-tex\u003E\u003Cspan class=\"paragraph\"\u003ESimilarly,\u003C/span\u003E\n\u003Cmarimo-tex class=\"arithmatex\"\u003E||[C_s^* = C_{max} - \\frac{(W_{max} - W_s) \\cdot \\rho_{air} \\cdot g_{co2}}{g_w}||]\u003C/marimo-tex\u003E\u003Cspan class=\"paragraph\"\u003EIf \u003Cmarimo-tex class=\"arithmatex\"\u003E||(C_s \u0026gt; C_s^*||)\u003C/marimo-tex\u003E - The supply air has a higher \u003Cmarimo-tex class=\"arithmatex\"\u003E||(CO_2||)\u003C/marimo-tex\u003E concentration than the critical threshold, which makes \u003Cmarimo-tex class=\"arithmatex\"\u003E||((C_{max} - C_s)||)\u003C/marimo-tex\u003E smaller. This increases the required airflow for \u003Cmarimo-tex class=\"arithmatex\"\u003E||(CO_2||)\u003C/marimo-tex\u003E control (\u003Cmarimo-tex class=\"arithmatex\"\u003E||(u_{CO2}||)\u003C/marimo-tex\u003E), ensuring \u003Cmarimo-tex class=\"arithmatex\"\u003E||(CO_2||)\u003C/marimo-tex\u003E remains the binding lower bound.\u003C/span\u003E\n\u003Cspan class=\"paragraph\"\u003EIf \u003Cmarimo-tex class=\"arithmatex\"\u003E||(C_s \u0026lt; C_s^*||)\u003C/marimo-tex\u003E - The supply air is cleaner (e.g., more fresh air), which reduces the \u003Cmarimo-tex class=\"arithmatex\"\u003E||(CO_2||)\u003C/marimo-tex\u003E airflow requirement. If the supply air is sufficiently clean, it is possible for the humidity requirement to become the binding constraint instead, depending on the performance of the cooling coil (\u003Cmarimo-tex class=\"arithmatex\"\u003E||(W_s||)\u003C/marimo-tex\u003E).\u003C/span\u003E\n\u003Cblockquote\u003E\n\u003Cspan class=\"paragraph\"\u003EBy enforcing an AHU supply condition where \u003Cmarimo-tex class=\"arithmatex\"\u003E||(C_s \u0026lt; C_s^*||)\u003C/marimo-tex\u003E, the system is reconfigured such that the humidity requirement becomes the dominant lower-bound constraint. This stabilization of \u003Cmarimo-tex class=\"arithmatex\"\u003E||(u_{lo}||)\u003C/marimo-tex\u003E allows the controller to utilize the temperature deadband \u003Cmarimo-tex class=\"arithmatex\"\u003E||(\\Delta T||)\u003C/marimo-tex\u003E as a buffer for thermal disturbances, effectively decoupling the rapid stochastic fluctuations of \u003Cmarimo-tex class=\"arithmatex\"\u003E||(CO_2||)\u003C/marimo-tex\u003E from the thermal regulation of the zone.\u003C/span\u003E\n\u003C/blockquote\u003E\u003C/span\u003E"}, "type": "data"}]}, {"code_hash": "43572b5ef542a8b15eaa37d2894332c0", "console": [], "id": "qnkX", "outputs": [{"data": {"text/plain": ""}, "type": "data"}]}, {"code_hash": "07bd57e3c4e8bece8d9ecae89b4051dd", "console": [], "id": "TqIu", "outputs": [{"data": {"text/plain": ""}, "type": "data"}]}, {"code_hash": null, "console": [], "id": "DnEU", "outputs": [{"data": {"text/plain": ""}, "type": "data"}]}], "metadata": {"marimo_version": "0.23.4", "script_metadata_hash": null}, "version": "1"},
            "runtimeConfig": null,
