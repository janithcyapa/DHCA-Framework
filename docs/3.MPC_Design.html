      function __resizeIframe(obj) {
        const scrollbarHeight = 20; // Max between windows, mac, and linux

        function setHeight() {
          // Guard against race condition where iframe isn't ready
          if (!obj.contentWindow?.document?.documentElement) {
            return;
          }
          const element = obj.contentWindow.document.documentElement;
          // If there is no vertical scrollbar, we don't need to resize the iframe
          if (element.scrollHeight === element.clientHeight) {
            return;
          }

          // Create a new height that includes the scrollbar height if it's visible
          const hasHorizontalScrollbar = element.scrollWidth > element.clientWidth;
          const newHeight = element.scrollHeight + (hasHorizontalScrollbar ? scrollbarHeight : 0);

          // Only update the height if it's different from the current height
          if (obj.style.height !== `${newHeight}px`) {
            obj.style.height = `${newHeight}px`;
          }
        }

        // Resize the iframe to the height of the content and bottom scrollbar height
        setHeight();

        // Resize the iframe when the content changes
        const resizeObserver = new ResizeObserver((_entries) => {
          setHeight();
        });
        // Only observe if iframe content is ready
        if (obj.contentWindow?.document?.body) {
          resizeObserver.observe(obj.contentWindow.document.body);
        }
      }
    </script>

            "session": {"cells": [{"code_hash": "c7eab6d5485c136cad36e341160191ea", "console": [], "id": "Hbol", "outputs": [{"data": {"text/html": "\u003Cstyle\u003E/* Load fonts from Google Fonts */\n@import url(\"https://fonts.googleapis.com/css2?family=Inter:opsz,wght@14..32,300..800\u0026family=Fira+Code:wght@300..700\u0026display=swap\");\n\n/* Font and Radius Variables */\n:root {\n    --monospace-font: \"Fira Code\", monospace;\n    --text-font: \"Inter\", system-ui, -apple-system, \"Segoe UI\", \"Roboto\", \"Open Sans\", sans-serif;\n    --heading-font: \"Inter\", system-ui, -apple-system, \"Segoe UI\", \"Roboto\", \"Open Sans\", sans-serif;\n    --radius: 12px;\n}\n\n/* Mininini Theme Colors */\n:root {\n    /* Backgrounds - soft, not pure black */\n    --background: light-dark(#ffffff, #181a1c);\n    --background-darker: light-dark(#e5e5e5, #101214);\n    --foreground: light-dark(#0a0a0a, #eef2f5);\n    --muted: light-dark(#f0f0f0, #222528);\n    --muted-foreground: light-dark(#777777, #9aa3ae);\n\n    /* UI Elements */\n    --card: light-dark(#fafafa, #1e2124);\n    --card-foreground: light-dark(#222222, #eef2f5);\n    --popover: light-dark(#e8e8e8, #181a1c);\n    --popover-foreground: light-dark(#0f0f0f, #eef2f5);\n    --border: light-dark(#444444, #2e3236);\n    --input: light-dark(#f5f5f5, #131517);\n\n    /* Primary Colors */\n    --primary: light-dark(#1e40af, #3b82f6);\n    --primary-foreground: light-dark(#ffffff, #ffffff);\n    --secondary: light-dark(#475569, #6c7a91);\n    --secondary-foreground: light-dark(#ffffff, #f1f5f9);\n    --accent: light-dark(#f97316, #fb923c);\n    --accent-foreground: light-dark(#ffffff, #ffffff);\n\n    /* Heading Colors - All gray except H4 (orange) and H5 (blue) */\n    --h1-color: light-dark(#1f2937, #e5e7eb); /* Gray */\n    --h2-color: light-dark(#374151, #d1d5db); /* Gray */\n    --h3-color: light-dark(#4b5563, #9ca3af); /* Gray */\n    /* --h4-color: light-dark(#ea580c, #f97316); Orange accent */\n    /*--h5-color: light-dark(#2563eb, #60a5fa);  Blue accent */\n    /* --h6-color: light-dark(#6b7280, #9ca3af); Gray (lighter) */\n\n    /* Code \u0026 Math Styling */\n    --inline-code-color: light-dark(#2563eb, #60a5fa);\n    --equation-color: light-dark(#6b7280, #9ca3af);\n\n    /* Semantic Colors */\n    --error: light-dark(#dc2626, #f87171);\n    --success: light-dark(#059669, #34d399);\n    --destructive: light-dark(#b91c1c, #ef4444);\n    --action: light-dark(#d97706, #fbbf24);\n    --link: light-dark(#2563eb, #3b82f6);\n    --link-visited: light-dark(#7c3aed, #a78bfa);\n\n    /* Shadows */\n    --base-shadow: light-dark(rgba(0, 0, 0, 0.08), rgba(0, 0, 0, 0.3));\n    --base-shadow-darker: light-dark(rgba(0, 0, 0, 0.12), rgba(0, 0, 0, 0.4));\n    --base-shadow-opacity: 8%;\n}\n\n/* Heading styles */\nh1, .h1 { \n    color: var(--h1-color); \n    font-weight: 800;\n    letter-spacing: -0.02em;\n}\n\nh2, .h2 { \n    color: var(--h2-color); \n    font-weight: 700;\n    letter-spacing: -0.01em;\n}\n\nh3, .h3 { \n    color: var(--h3-color); \n    font-weight: 600;\n}\n\n/* Updated Heading styles (Matches Callout Colors) */\nh4, .h4 { \n    color: var(--primary); /* Blue- Definitions */\n    font-size: 1.25em;\n    font-weight: 700; \n    letter-spacing: -0.01em; \n    margin-top: 1.2em;\n    margin-bottom: 0.5em;\n}\n\nh5, .h5 { \n    color: var(--accent); /* Orange - Theorems */\n    font-size: 1.15em;\n    font-weight: 600;\n    letter-spacing: -0.01em;\n    margin-top: 1.2em;\n    margin-bottom: 0.5em;\n}\n\nh6, .h6 { \n    color: var(--success); /* Green - Examples */\n    font-size: 1.05em;\n    font-weight: 600;\n    margin-top: 1.2em;\n    margin-bottom: 0.5em;\n}\n\n/* Inline code styling - Blue */\ncode:not(pre code), .inline-code {\n    color: var(--inline-code-color);\n    font-family: var(--monospace-font);\n    background-color: var(--muted);\n    padding: 0.2em 0.4em;\n    border-radius: 6px;\n    font-size: 1.0em;\n    font-weight: 500;\n}\n\n/* Equation styling - Gray */\nmarimo-tex,\n.arithmatex,\n.marimo-tex,\n.katex,\n.katex *,\n.mjx-container,\nmjx-container,\n.math {\n    color: var(--equation-color) !important;\n    font-size: 1.0em;\n}\n\nmarimo-tex mjx-container,\nmarimo-tex .MathJax,\nmarimo-tex [class*=\"math\"] {\n    color: var(--equation-color) !important;\n    font-size: 1.0em;\n}\n\n.latex,\n.latex *,\n.tex,\n.tex * {\n    color: var(--equation-color) !important;\n    font-size: 1.0em;\n}\n\n/* Code blocks subtle blue tint */\npre code {\n    background-color: var(--background-darker);\n    border-left: 3px solid var(--primary);\n    font-size: 1.0em;\n}\n\n.markdown marimo-tex,\n.prose marimo-tex {\n    color: var(--equation-color) !important;\n    font-size: 1.0em;\n}\n\n/* =========================================\n   Global Table Styling (Marimo \"Nuclear\" Override)\n   ========================================= */\n\n/* Target the table container aggressively */\n:root body [class*=\"prose\"] table,\nmarimo-markdown table {\n    width: 100% !important;\n    border-collapse: collapse !important;\n    margin: 1.5em 0 !important;\n}\n\n/* Force Header Styles */\n:root body [class*=\"prose\"] th,\nmarimo-markdown th {\n    padding: 12px 16px !important;\n    border-bottom: 2px solid var(--border) !important;\n    color: var(--h3-color) !important;\n    font-weight: 600 !important;\n    background-color: transparent !important;\n    text-align: left !important;\n}\n\n/* Base Cell Styles */\n:root body [class*=\"prose\"] td,\nmarimo-markdown td {\n    padding: 12px 16px !important;\n    border-bottom: 1px solid var(--border) !important;\n    color: var(--foreground) !important;\n}\n\n/* Zebra Striping - Applied directly to the TD so Marimo can't cover it up */\n:root body [class*=\"prose\"] tbody tr:nth-child(odd) td,\nmarimo-markdown tbody tr:nth-child(odd) td {\n    background-color: var(--muted) !important;\n}\n\n:root body [class*=\"prose\"] tbody tr:nth-child(even) td,\nmarimo-markdown tbody tr:nth-child(even) td {\n    background-color: transparent !important;\n}\n\n/* Hover effect - Also applied to the TD */\n:root body [class*=\"prose\"] tbody tr:hover td,\nmarimo-markdown tbody tr:hover td {\n    background-color: var(--background-darker) !important;\n}\n\n/* =========================================\n   Markdown Blockquote Callouts (No HTML/Python needed)\n   ========================================= */\n\n/* Base style for ALL blockquotes (Standard Notes) */\n.prose blockquote, marimo-markdown blockquote {\n    padding: 16px !important;\n    margin: 1.5em 0 !important;\n    border-radius: 0 var(--radius) var(--radius) 0 !important;\n    border-left: 4px solid var(--secondary) !important;\n    background-color: var(--muted) !important;\n    box-shadow: var(--base-shadow) !important;\n    font-style: normal !important; /* Removes the default italic text */\n    color: var(--foreground) !important;\n}\n\n/* Remove awkward spacing at the top of the box */\n.prose blockquote \u003E :first-child, marimo-markdown blockquote \u003E :first-child {\n    margin-top: 0 !important;\n}\n\n/* 1. Definitions -\u003E Triggered by #### (H4) */\n.prose blockquote:has(h4), marimo-markdown blockquote:has(h4) {\n    border-left-color: var(--primary) !important;\n    background-color: light-dark(rgba(30, 64, 175, 0.06), rgba(59, 130, 246, 0.08)) !important;\n}\n\n/* 2. Theorems -\u003E Triggered by ##### (H5) */\n.prose blockquote:has(h5), marimo-markdown blockquote:has(h5) {\n    border-left-color: var(--accent) !important;\n    background-color: light-dark(rgba(249, 115, 22, 0.08), rgba(251, 146, 60, 0.08)) !important;\n}\n\n/* 3. Examples -\u003E Triggered by ###### (H6) */\n.prose blockquote:has(h6), marimo-markdown blockquote:has(h6) {\n    border-left-color: var(--success) !important;\n    background-color: light-dark(rgba(5, 150, 105, 0.06), rgba(52, 211, 153, 0.06)) !important;\n}\n\n/* Force the H6 Example title to be green instead of gray */\n.prose blockquote h6, marimo-markdown blockquote h6 {\n    color: var(--success) !important;\n    font-size: 1.1em !important;\n    font-weight: 600 !important;\n    letter-spacing: -0.01em !important;\n}\n\u003C/style\u003E"}, "type": "data"}]}, {"code_hash": "7b5dddda763eaaaaacddd8f4001d43a3", "console": [], "id": "MJUe", "outputs": [{"data": {"text/markdown": "\u003Cspan class=\"markdown prose dark:prose-invert contents\"\u003E\u003Cspan class=\"paragraph\"\u003E\u003Ca href=\"https://janithcyapa.github.io/DHCA-Framework/\" rel=\"noopener noreferrer\" target=\"_blank\"\u003E\ud83c\udfe0 Home\u003C/a\u003E\u003C/span\u003E\u003C/span\u003E"}, "type": "data"}]}, {"code_hash": "bd16769766716438e57a1d8a2e69f59e", "console": [], "id": "vblA", "outputs": [{"data": {"text/markdown": "\u003Cspan class=\"markdown prose dark:prose-invert contents\"\u003E\u003Ch1 id=\"model-pridictive-control-for-the-thermal-zone\"\u003EModel Pridictive Control for the Thermal Zone\u003C/h1\u003E\u003C/span\u003E"}, "type": "data"}]}, {"code_hash": "f87bc927fd2634985f47dc946313cead", "console": [], "id": "bkHC", "outputs": [{"data": {"text/markdown": "\u003Cspan class=\"markdown prose dark:prose-invert contents\"\u003E\u003Ch2 id=\"system-dynamic\"\u003ESystem Dynamic\u003C/h2\u003E\u003C/span\u003E"}, "type": "data"}]}, {"code_hash": "abcda4cd60e47aa1077e0eb713f3a8d6", "console": [], "id": "lEQa", "outputs": [{"data": {"text/markdown": "\u003Cspan class=\"markdown prose dark:prose-invert contents\"\u003E\u003Ch3 id=\"11-system-dynamics-from-previous-calculations\"\u003E1.1 System Dynamics From Previous calculations\u003C/h3\u003E\n\u003Cspan class=\"paragraph\"\u003ETo remove all the parts that are difficult to measure and to estimate define all of them as and The lumped disturbance vector (\u003Cmarimo-tex class=\"arithmatex\"\u003E||(d_i||)\u003C/marimo-tex\u003E):\u003C/span\u003E\n\u003Cmarimo-tex class=\"arithmatex\"\u003E||[ d_{T,i} = Q_{solar,i} + Q_{\\text{inf},i} + Q_{equip,i} + \\sum \\dot{m}_{ij} c_p (T_{in,j} - T_{in,i}) + \\text{unmodeled conduction} \\tag{6(a)}||]\u003C/marimo-tex\u003E\u003Cmarimo-tex class=\"arithmatex\"\u003E||[ d_{W,i} = \\dot{m}_{inf,i}(W_{out} - W_{in,i}) + \\sum \\dot{m}_{mix,ij} (W_{in,j} - W_{in,i}) + \\text{unmodeled moisture leaks} \\tag{6(b)}||]\u003C/marimo-tex\u003E\u003Cmarimo-tex class=\"arithmatex\"\u003E||[ d_{C,i} = \\dot{V}_{inf,i}(C_{out} - C_{in,i}) + \\sum \\dot{V}_{mix,ij} (C_{in,j} - C_{in,i}) + \\text{unmodeled } CO_2 \\text{ leaks} \\tag{6(c)}||]\u003C/marimo-tex\u003E\u003Cspan class=\"paragraph\"\u003EThen our system becomes,\u003C/span\u003E\n\u003Cmarimo-tex class=\"arithmatex\"\u003E||[C_{\\text{air},i} \\ \\dot{T}_{in,i}=\n\\frac{T_{\\text{out}} - T_{in,i}}{R_{\\text{env,external},i}} +\n\\sum_{j \\in \\text{adj}(i)} \\frac{T_{in,j} - T_{in,i}}{R_{\\text{env,couple},ij}} +\n\\frac{T_{m,i} - T_{in,i}}{R_{\\text{int},i}} +\nN_{occ,i}\u22c5q_{person}+\n\\rho_{air} \\dot{V}_{s,i} \\ c_p \\ (T_s - T_{in,i}) +\nd_{T,i} \\tag{7}||]\u003C/marimo-tex\u003E\u003Cmarimo-tex class=\"arithmatex\"\u003E||[C_{\\text{mass},i} \\ \\dot{T}_{m,i}= \\frac{T_{in,i} - T_{m,i}}{R_{\\text{int},i}} \\tag{8}||]\u003C/marimo-tex\u003E\u003Cmarimo-tex class=\"arithmatex\"\u003E||[M_{air,i}\\ \\dot{W}_{in,i} =\nN_{occ,i} \u22c5g_{w,person} +\n\\rho_{air} \\dot{V}_{s,i} (W_s - W_{in,i}) +\nd_{W,i} \\tag{9}||]\u003C/marimo-tex\u003E\u003Cmarimo-tex class=\"arithmatex\"\u003E||[V_{room,i}  \\ \\dot{C}_{in,i} =\nN_{occ,i}\u22c5g_{co2,person} +\n\\dot{V}_{s,i}(C_{s} - C_{in,i}) +\nd_{C,i} \\tag{10}||]\u003C/marimo-tex\u003E\u003Cspan class=\"paragraph\"\u003E\u003Cem\u003E(Note: In this calculations I have removed \u003Cmarimo-tex class=\"arithmatex\"\u003E||(X_i||)\u003C/marimo-tex\u003E notation for simplicity.)\u003C/em\u003E\u003C/span\u003E\n\u003Cspan class=\"paragraph\"\u003E\u003Cem\u003ENote: For numerical consistency, \u003Cmarimo-tex class=\"arithmatex\"\u003E||(C||)\u003C/marimo-tex\u003E is expressed as a volumetric fraction (m\u00b3 CO\u2082 / m\u00b3 air) in the ODE.\nConversion: \u003Cmarimo-tex class=\"arithmatex\"\u003E||(C_{\\text{frac}} = C_{\\text{ppm}} \\times 10^{-6}||)\u003C/marimo-tex\u003E. The generation rate \u003Cmarimo-tex class=\"arithmatex\"\u003E||(g_{co2,person}||)\u003C/marimo-tex\u003E is then in m\u00b3/s\u00b7person.\u003C/em\u003E\u003C/span\u003E\u003C/span\u003E"}, "type": "data"}]}, {"code_hash": "4e233d756038e83290e285a615862159", "console": [], "id": "PKri", "outputs": [{"data": {"text/markdown": "\u003Cspan class=\"markdown prose dark:prose-invert contents\"\u003E\u003Ch2 id=\"mpc-design\"\u003EMPC Design\u003C/h2\u003E\u003C/span\u003E"}, "type": "data"}]}, {"code_hash": "87e4c7b1bebd0a249a01f9a76861bb47", "console": [], "id": "Xref", "outputs": [{"data": {"text/markdown": "\u003Cspan class=\"markdown prose dark:prose-invert contents\"\u003E\u003Ch3 id=\"1-state-and-disturbance-extraction\"\u003E1. State and Disturbance Extraction\u003C/h3\u003E\u003C/span\u003E"}, "type": "data"}]}, {"code_hash": "d21230a5f0e7742f16c24e1f3fff2b26", "console": [], "id": "SFPL", "outputs": [{"data": {"text/markdown": "\u003Cspan class=\"markdown prose dark:prose-invert contents\"\u003E\u003Cspan class=\"paragraph\"\u003EAt the start of control interval k, the MPC read the optimal estimates from EKF.\nAt every control interval k, the EKF provides an augmented state vector, which the MPC splits into two distinct categories,\u003C/span\u003E\n\u003Cspan class=\"paragraph\"\u003EThe System States (\u003Cmarimo-tex class=\"arithmatex\"\u003E||(\\hat{x}_k||)\u003C/marimo-tex\u003E)\u003C/span\u003E\n\u003Cmarimo-tex class=\"arithmatex\"\u003E||[ \\hat{x}_k = \\begin{bmatrix} T_{in} \\\\ T_{m} \\\\ C_{in} \\\\ W_{in}  \\end{bmatrix} ||]\u003C/marimo-tex\u003E\u003Cspan class=\"paragraph\"\u003EUnmeasured Disturbances (\u003Cmarimo-tex class=\"arithmatex\"\u003E||(\\hat{d}_k||)\u003C/marimo-tex\u003E)\u003C/span\u003E\n\u003Cmarimo-tex class=\"arithmatex\"\u003E||[ \\hat{d}_k = \\begin{bmatrix}  d_{T} \\\\ d_{W} \\end{bmatrix} ||]\u003C/marimo-tex\u003E\u003Cspan class=\"paragraph\"\u003EThe Control Input (\u003Cmarimo-tex class=\"arithmatex\"\u003E||(u||)\u003C/marimo-tex\u003E)\u003C/span\u003E\n\u003Cmarimo-tex class=\"arithmatex\"\u003E||[ u = \\begin{bmatrix} \\dot{V}_s \\end{bmatrix}||]\u003C/marimo-tex\u003E\u003Cspan class=\"paragraph\"\u003EThe MPC assumes that whatever unmodeled disturbances are happening right now will remain constant across the entire future prediction horizon (\u003Cmarimo-tex class=\"arithmatex\"\u003E||(N_p||)\u003C/marimo-tex\u003E)\u003C/span\u003E\n\u003Cmarimo-tex class=\"arithmatex\"\u003E||[\\dot{x}(t)=f(x(t),u(t),d(t))||]\u003C/marimo-tex\u003E\u003Cspan class=\"paragraph\"\u003EIn Real-Time Iteration, we linearize around the current reality of the system at time step \u003Cmarimo-tex class=\"arithmatex\"\u003E||(k||)\u003C/marimo-tex\u003E. We freeze the system using the optimal estimates from the EKF (\u003Cmarimo-tex class=\"arithmatex\"\u003E||(\\hat{x}_{k\u2223k}||)\u003C/marimo-tex\u003E and \u003Cmarimo-tex class=\"arithmatex\"\u003E||(\\hat{d}_{k\u2223k}||)\u003C/marimo-tex\u003E) and the previously applied control action (\u003Cmarimo-tex class=\"arithmatex\"\u003E||(u_{k-1}||)\u003C/marimo-tex\u003E).\u003C/span\u003E\n\u003Cul\u003E\n\u003Cli\u003E\u003Cmarimo-tex class=\"arithmatex\"\u003E||(x_{op} = \\hat{x}_{k|k} = [\\hat{T}_{in}, \\hat{T}_m, \\hat{C}_{in}, \\hat{W}_{in}]^T||)\u003C/marimo-tex\u003E\u003C/li\u003E\n\u003Cli\u003E\u003Cmarimo-tex class=\"arithmatex\"\u003E||(u_{op} = u_{k-1}||)\u003C/marimo-tex\u003E\u003C/li\u003E\n\u003Cli\u003E\u003Cmarimo-tex class=\"arithmatex\"\u003E||(d_{op} = \\hat{d}_{k|k} = [\\hat{d}_T, \\hat{d}_W, 0]^T||)\u003C/marimo-tex\u003E\u003C/li\u003E\n\u003C/ul\u003E\u003C/span\u003E"}, "type": "data"}]}, {"code_hash": "a740b5ff3dbbda04504b574813ec9295", "console": [], "id": "BYtC", "outputs": [{"data": {"text/markdown": "\u003Cspan class=\"markdown prose dark:prose-invert contents\"\u003E\u003Ch3 id=\"2-successive-linearization\"\u003E2. Successive Linearization\u003C/h3\u003E\u003C/span\u003E"}, "type": "data"}]}, {"code_hash": "b084c85f69ee230ae016ff3c5f459de2", "console": [], "id": "RGSE", "outputs": [{"data": {"text/markdown": "\u003Cspan class=\"markdown prose dark:prose-invert contents\"\u003E\u003Cspan class=\"paragraph\"\u003EStandard embedded solvers (like OSQP) only solve Quadratic Programs (QPs), which strictly require linear dynamics. So use Successive Linearization to linearize the dynamics.\u003C/span\u003E\n\u003Col\u003E\n\u003Cli\u003EThe State Jacobian \u003Cmarimo-tex class=\"arithmatex\"\u003E||(A_c||)\u003C/marimo-tex\u003E\u003C/li\u003E\n\u003C/ol\u003E\n\u003Cmarimo-tex class=\"arithmatex\"\u003E||[A_c = \\left. \\frac{\\partial f}{\\partial x} \\right|_{x_{op}, u_{op}, d_{op}}||]\u003C/marimo-tex\u003E\u003Cmarimo-tex class=\"arithmatex\"\u003E||[A_c = \\begin{bmatrix}\n\\frac{\\partial \\dot{T}{in}}{\\partial T{in}} \u0026amp; \\frac{\\partial \\dot{T}{in}}{\\partial T_m} \u0026amp; 0 \u0026amp; 0 \\\\\n\\frac{\\partial \\dot{T}m}{\\partial T{in}} \u0026amp; \\frac{\\partial \\dot{T}m}{\\partial T_m} \u0026amp; 0 \u0026amp; 0 \\\\\n0 \u0026amp; 0 \u0026amp; \\frac{\\partial \\dot{C}{in}}{\\partial C{in}} \u0026amp; 0 \\\\\n0 \u0026amp; 0 \u0026amp; 0 \u0026amp; \\frac{\\partial \\dot{W}{in}}{\\partial W{in}}\n\\end{bmatrix}||]\u003C/marimo-tex\u003E\u003Cmarimo-tex class=\"arithmatex\"\u003E||[A_c = \\begin{bmatrix}\n-\\frac{1}{C_{air}} \\left( \\frac{1}{R_{env,ext}} + \\sum \\frac{1}{R_{env,cplj}} + \\frac{1}{R_{int}} + \\rho_{air} c_p u_{op} \\right) \u0026amp; \\frac{1}{C{air} R_{int}} \u0026amp; 0 \u0026amp; 0 \\\\\n\\frac{1}{C_{mass} R_{int}} \u0026amp; -\\frac{1}{C_{mass} R_{int}} \u0026amp; 0 \u0026amp; 0 \\\\\n0 \u0026amp; 0 \u0026amp; -\\frac{\\rho_{air}u_{op}}{M_{air}} \u0026amp; 0 \\\\\n0 \u0026amp; 0 \u0026amp; 0 \u0026amp; -\\frac{u_{op}}{V_{room}}\n\\end{bmatrix}||]\u003C/marimo-tex\u003E\u003Col start=\"2\"\u003E\n\u003Cli\u003EThe Input Jacobian \u003Cmarimo-tex class=\"arithmatex\"\u003E||(B_c||)\u003C/marimo-tex\u003E\u003C/li\u003E\n\u003C/ol\u003E\n\u003Cmarimo-tex class=\"arithmatex\"\u003E||[B_c = \\left. \\frac{\\partial f}{\\partial u} \\right|_{x_{op}, u_{op}, d_{op}}||]\u003C/marimo-tex\u003E\u003Cmarimo-tex class=\"arithmatex\"\u003E||[B_c = \\begin{bmatrix}\n\\frac{\\partial \\dot{T}{in}}{\\partial u} \\\\\n0 \\\\\n\\frac{\\partial \\dot{C}{in}}{\\partial u} \\\\\n\\frac{\\partial \\dot{W}_{in}}{\\partial u}\n\\end{bmatrix}||]\u003C/marimo-tex\u003E\u003Cmarimo-tex class=\"arithmatex\"\u003E||[B_c =  \\begin{bmatrix}\n\\frac{\\rho_{air} c_p (T_s - T_{in,op})}{C_{air}} \\\\\n0 \\\\\n\\frac{\\rho_{air} (W_s - W_{in,op})}{M_{air}} \\\\\n\\frac{C_s - C_{in,op}}{V_{room}}\n\\end{bmatrix}||]\u003C/marimo-tex\u003E\u003Col start=\"3\"\u003E\n\u003Cli\u003EThe Affine Drift Vector \u003Cmarimo-tex class=\"arithmatex\"\u003E||(C_c||)\u003C/marimo-tex\u003E\u003C/li\u003E\n\u003C/ol\u003E\n\u003Cspan class=\"paragraph\"\u003ETo complete the Taylor series, we calculate the continuous drift vector to capture the affine offset\u003C/span\u003E\n\u003Cmarimo-tex class=\"arithmatex\"\u003E||[c_c = f(x_{op}, u_{op}, d_{op}) - A_c x_{op} - B_c u_{op}||]\u003C/marimo-tex\u003E\u003Cspan class=\"paragraph\"\u003EThe locally linear continuous model is now mathematically perfectly flat at this exact millisecond\u003C/span\u003E\n\u003Cmarimo-tex class=\"arithmatex\"\u003E||[\\dot{x} = A_c x + B_c u + c_c||]\u003C/marimo-tex\u003E\u003C/span\u003E"}, "type": "data"}]}, {"code_hash": "fd71332ff05b771dce4dc0ba56482c6b", "console": [], "id": "Kclp", "outputs": [{"data": {"text/markdown": "\u003Cspan class=\"markdown prose dark:prose-invert contents\"\u003E\u003Ch3 id=\"3-discretization\"\u003E3. Discretization\u003C/h3\u003E\u003C/span\u003E"}, "type": "data"}]}, {"code_hash": "01d79baf64f25e4f525914cc627e4b1b", "console": [], "id": "emfo", "outputs": [{"data": {"text/markdown": "\u003Cspan class=\"markdown prose dark:prose-invert contents\"\u003E\u003Cspan class=\"paragraph\"\u003EEmbedded QP solvers operate in discrete steps \u003Cmarimo-tex class=\"arithmatex\"\u003E||(i=0,1,\u2026,N_p||)\u003C/marimo-tex\u003E across the prediction horizon. We convert our continuous affine model (\u003Cmarimo-tex class=\"arithmatex\"\u003E||(\\dot{x}||)\u003C/marimo-tex\u003E) to a discrete model (\u003Cmarimo-tex class=\"arithmatex\"\u003E||(x_{i+1}||)\u003C/marimo-tex\u003E) using your controller's sampling time \u003Cmarimo-tex class=\"arithmatex\"\u003E||(T_s||)\u003C/marimo-tex\u003E.\u003C/span\u003E\n\u003Cspan class=\"paragraph\"\u003EUsing the Forward Euler approximation:\u003C/span\u003E\n\u003Cmarimo-tex class=\"arithmatex\"\u003E||[\\dot{x} \\approx \\frac{x_{i+1} - x_i}{T_s}||]\u003C/marimo-tex\u003E\u003Cspan class=\"paragraph\"\u003ESubstitute our affine continuous model:\u003C/span\u003E\n\u003Cmarimo-tex class=\"arithmatex\"\u003E||[\\frac{x_{i+1} - x_i}{T_s} = A_c x_i + B_c u_i + c_c||]\u003C/marimo-tex\u003E\u003Cspan class=\"paragraph\"\u003EMultiply by \u003Cmarimo-tex class=\"arithmatex\"\u003E||(T_s||)\u003C/marimo-tex\u003E and isolate \u003Cmarimo-tex class=\"arithmatex\"\u003E||(x_{i+1}||)\u003C/marimo-tex\u003E:\u003C/span\u003E\n\u003Cmarimo-tex class=\"arithmatex\"\u003E||[x_{i+1} = x_i +  A_c x_i T_s +  B_c u_i T_s + c_c T_s||]\u003C/marimo-tex\u003E\u003Cmarimo-tex class=\"arithmatex\"\u003E||[x_{i+1} = (I_{4 \\times 4} + A_c T_s)x_i + (B_c T_s)u_i + (c_c T_s)||]\u003C/marimo-tex\u003E\u003Cspan class=\"paragraph\"\u003EYielding the final discrete matrices:\u003C/span\u003E\n\u003Cul\u003E\n\u003Cli\u003E\u003Cmarimo-tex class=\"arithmatex\"\u003E||(A_d = I_{4 \\times 4} + A_c T_s||)\u003C/marimo-tex\u003E\u003C/li\u003E\n\u003Cli\u003E\u003Cmarimo-tex class=\"arithmatex\"\u003E||(B_d = B_c T_s||)\u003C/marimo-tex\u003E\u003C/li\u003E\n\u003Cli\u003E\u003Cmarimo-tex class=\"arithmatex\"\u003E||(c_d = c_c T_s||)\u003C/marimo-tex\u003E\u003C/li\u003E\n\u003C/ul\u003E\n\u003Cspan class=\"paragraph\"\u003ENote : \u003Cmarimo-tex class=\"arithmatex\"\u003E||(T_s||)\u003C/marimo-tex\u003E is chosen such that \u003Cmarimo-tex class=\"arithmatex\"\u003E||(|\u03bb_i(A_d)| \u0026lt; 1||)\u003C/marimo-tex\u003E for all eigenvalues,\nCheck : switch to \u003Cmarimo-tex class=\"arithmatex\"\u003E||(expm(A_c\u00b7T_s)||)\u003C/marimo-tex\u003E (matrix exponential / ZOH) for \u003Cmarimo-tex class=\"arithmatex\"\u003E||(A_d||)\u003C/marimo-tex\u003E and \u003Cmarimo-tex class=\"arithmatex\"\u003E||((A_c)\u207b\u00b9(A_d - I)\u00b7B_c||)\u003C/marimo-tex\u003E for \u003Cmarimo-tex class=\"arithmatex\"\u003E||(B_d||)\u003C/marimo-tex\u003E. ZOH is unconditionally stable for stable systems.\u003C/span\u003E\n\u003Cspan class=\"paragraph\"\u003EAt the current control interval \u003Cmarimo-tex class=\"arithmatex\"\u003E||(k||)\u003C/marimo-tex\u003E \u003Cmarimo-tex class=\"arithmatex\"\u003E||(A_d, B_d||)\u003C/marimo-tex\u003E, and \u003Cmarimo-tex class=\"arithmatex\"\u003E||(c_d||)\u003C/marimo-tex\u003E.\u003C/span\u003E\n\u003Cmarimo-tex class=\"arithmatex\"\u003E||[x_{k+1} = A_d x_k + B_d u_k + c_d||]\u003C/marimo-tex\u003E\u003C/span\u003E"}, "type": "data"}]}, {"code_hash": "4348fffd6928f979f6aab9273088411e", "console": [], "id": "bYos", "outputs": [{"data": {"text/markdown": "\u003Cspan class=\"markdown prose dark:prose-invert contents\"\u003E\u003Ch3 id=\"4-formulating-the-sparse-qp-problem\"\u003E4. Formulating the Sparse QP Problem\u003C/h3\u003E\u003C/span\u003E"}, "type": "data"}]}, {"code_hash": "5240a9497888c5b30b3d9917c0093e41", "console": [], "id": "SyDm", "outputs": [{"data": {"text/markdown": "\u003Cspan class=\"markdown prose dark:prose-invert contents\"\u003E\u003Cspan class=\"paragraph\"\u003EWe must format everything into the standard Sparse QP formulation,\u003C/span\u003E\n\u003Cspan class=\"paragraph\"\u003E\u003Cstrong\u003EMinimize:\u003C/strong\u003E \u003C/span\u003E\n\u003Cmarimo-tex class=\"arithmatex\"\u003E||[\\frac{1}{2} Z^T P Z + q^T Z||]\u003C/marimo-tex\u003E\u003Cspan class=\"paragraph\"\u003E\u003Cstrong\u003ESubject to:\u003C/strong\u003E \u003C/span\u003E\n\u003Cmarimo-tex class=\"arithmatex\"\u003E||[l \\le G Z \\le u||]\u003C/marimo-tex\u003E\u003Cul\u003E\n\u003Cli\u003EGlobal Decision Vector (Z)\u003C/li\u003E\n\u003Cli\u003ECost Function (Hessian P and Gradient q)\u003C/li\u003E\n\u003Cli\u003EConstraints Matrix (G) and Bounds (l,u)\u003C/li\u003E\n\u003C/ul\u003E\u003C/span\u003E"}, "type": "data"}]}, {"code_hash": "98ab87ebfaa0a5c7488b20edaa6215bd", "console": [], "id": "AzZE", "outputs": [{"data": {"text/markdown": "\u003Cspan class=\"markdown prose dark:prose-invert contents\"\u003E\u003Col\u003E\n\u003Cli\u003EThe Global Decision Vector (\u003Cmarimo-tex class=\"arithmatex\"\u003E||(Z||)\u003C/marimo-tex\u003E)\u003C/li\u003E\n\u003C/ol\u003E\n\u003Cspan class=\"paragraph\"\u003EWe stack the states \u003Cmarimo-tex class=\"arithmatex\"\u003E||(x||)\u003C/marimo-tex\u003E, the inputs \u003Cmarimo-tex class=\"arithmatex\"\u003E||(u||)\u003C/marimo-tex\u003E, and our slack variables \u003Cmarimo-tex class=\"arithmatex\"\u003E||(\\epsilon_c||)\u003C/marimo-tex\u003E (\u003Cmarimo-tex class=\"arithmatex\"\u003E||(CO_2||)\u003C/marimo-tex\u003E penalty) and \u003Cmarimo-tex class=\"arithmatex\"\u003E||(\\epsilon_w||)\u003C/marimo-tex\u003E (Humidity penalty) across the entire prediction horizon \u003Cmarimo-tex class=\"arithmatex\"\u003E||(N||)\u003C/marimo-tex\u003E.\u003C/span\u003E\n\u003Cmarimo-tex class=\"arithmatex\"\u003E||[Z = [x_0, x_1, \\dots, x_N, \\; u_0, u_1, \\dots, u_{N-1}, \\; \\epsilon_{c,1}, \\dots, \\epsilon_{c,N}, \\; \\epsilon_{w,1}, \\dots, \\epsilon_{w,N}]^T||]\u003C/marimo-tex\u003E\u003C/span\u003E"}, "type": "data"}]}, {"code_hash": "164d0b3274b22b9cf8a063811f2679ba", "console": [], "id": "LgAW", "outputs": [{"data": {"text/markdown": "\u003Cspan class=\"markdown prose dark:prose-invert contents\"\u003E\u003Col start=\"2\"\u003E\n\u003Cli\u003EThe Cost Function (Hessian \u003Cmarimo-tex class=\"arithmatex\"\u003E||(P||)\u003C/marimo-tex\u003E and Gradient \u003Cmarimo-tex class=\"arithmatex\"\u003E||(q||)\u003C/marimo-tex\u003E)\u003C/li\u003E\n\u003C/ol\u003E\n\u003Cspan class=\"paragraph\"\u003EWe heavily penalize deviating from the Temperature setpoint (\u003Cmarimo-tex class=\"arithmatex\"\u003E||(T_{ref}||)\u003C/marimo-tex\u003E), lightly penalize fan energy (\u003Cmarimo-tex class=\"arithmatex\"\u003E||(u||)\u003C/marimo-tex\u003E), and \u003Cstrong\u003Emassively\u003C/strong\u003E penalize the slack variables to create your exponential-style boundary shield.\u003C/span\u003E\n\u003Cul\u003E\n\u003Cli\u003E\u003Cmarimo-tex class=\"arithmatex\"\u003E||(Q_{diag}||)\u003C/marimo-tex\u003E: Penalty for temperature. Only the first element is non-zero (\u003Cmarimo-tex class=\"arithmatex\"\u003E||(Q_{1,1} \\gg 0||)\u003C/marimo-tex\u003E). We do not penalize \u003Cmarimo-tex class=\"arithmatex\"\u003E||(CO_2||)\u003C/marimo-tex\u003E or Humidity tracking here.\u003C/li\u003E\n\u003Cli\u003E\u003Cmarimo-tex class=\"arithmatex\"\u003E||(R||)\u003C/marimo-tex\u003E: Penalty for damper usage.\u003C/li\u003E\n\u003Cli\u003E\u003Cmarimo-tex class=\"arithmatex\"\u003E||(\\rho_c, \\rho_w||)\u003C/marimo-tex\u003E: Massive penalties (e.g., \u003Cmarimo-tex class=\"arithmatex\"\u003E||(10^6||)\u003C/marimo-tex\u003E) for exceeding ASHRAE limits.\u003C/li\u003E\n\u003C/ul\u003E\n\u003Cspan class=\"paragraph\"\u003EThe Hessian block matrix \u003Cmarimo-tex class=\"arithmatex\"\u003E||(P||)\u003C/marimo-tex\u003E is structured diagonally:\u003C/span\u003E\n\u003Cmarimo-tex class=\"arithmatex\"\u003E||[P = \\text{blockdiag}(Q, Q, \\dots, Q_N, \\; R, R, \\dots, R, \\; \\rho_c, \\dots, \\rho_c, \\; \\rho_w, \\dots, \\rho_w)||]\u003C/marimo-tex\u003E\u003Cspan class=\"paragraph\"\u003EThe Gradient vector \u003Cmarimo-tex class=\"arithmatex\"\u003E||(q||)\u003C/marimo-tex\u003E shifts the temperature quadratic bowl so its minimum rests exactly on \u003Cmarimo-tex class=\"arithmatex\"\u003E||(T_{ref}||)\u003C/marimo-tex\u003E:\u003C/span\u003E\n\u003Cmarimo-tex class=\"arithmatex\"\u003E||[q = [-Q x_{ref}, \\dots, -Q x_{ref}, \\; 0, \\dots, 0, \\; 0, \\dots, 0, \\; 0, \\dots, 0]^T||]\u003C/marimo-tex\u003E\u003Cspan class=\"paragraph\"\u003E\u003Cem\u003E(Where \u003Cmarimo-tex class=\"arithmatex\"\u003E||(x_{ref} = [T_{ref}, 0, 0, 0]^T||)\u003C/marimo-tex\u003E)\u003C/em\u003E\u003C/span\u003E\u003C/span\u003E"}, "type": "data"}]}, {"code_hash": "8db097272bb5c6ee88a0618774459a9b", "console": [], "id": "TkPh", "outputs": [{"data": {"text/markdown": "\u003Cspan class=\"markdown prose dark:prose-invert contents\"\u003E\u003Col start=\"3\"\u003E\n\u003Cli\u003EThe Constraints Matrix (\u003Cmarimo-tex class=\"arithmatex\"\u003E||(G||)\u003C/marimo-tex\u003E) and Bounds (\u003Cmarimo-tex class=\"arithmatex\"\u003E||(l, u||)\u003C/marimo-tex\u003E)\u003C/li\u003E\n\u003C/ol\u003E\n\u003Cspan class=\"paragraph\"\u003EWe build a massive, sparse matrix \u003Cmarimo-tex class=\"arithmatex\"\u003E||(G||)\u003C/marimo-tex\u003E to enforce three physical laws simultaneously.\u003C/span\u003E\n\u003Cspan class=\"paragraph\"\u003E\u003Cstrong\u003EI. Constraint A: System Dynamics (Equality)\u003C/strong\u003E\u003C/span\u003E\n\u003Cspan class=\"paragraph\"\u003EThe solver must obey your thermodynamic equations.\u003C/span\u003E\n\u003Cmarimo-tex class=\"arithmatex\"\u003E||[x_{k+1} - A_d x_k - B_d u_k = c_d||]\u003C/marimo-tex\u003E\u003Cul\u003E\n\u003Cli\u003E\u003Cstrong\u003ELower Bound (\u003Cmarimo-tex class=\"arithmatex\"\u003E||(l||)\u003C/marimo-tex\u003E) = Upper Bound (\u003Cmarimo-tex class=\"arithmatex\"\u003E||(u||)\u003C/marimo-tex\u003E) = \u003Cmarimo-tex class=\"arithmatex\"\u003E||(c_d||)\u003C/marimo-tex\u003E\u003C/strong\u003E\u003C/li\u003E\n\u003C/ul\u003E\n\u003Cspan class=\"paragraph\"\u003E\u003Cstrong\u003EII. Constraint B: Actuator Limits (Hard Inequality)\u003C/strong\u003E\nThe VAV box damper has minimum and maximum limits.\u003C/span\u003E\n\u003Cmarimo-tex class=\"arithmatex\"\u003E||[0 \\le u_k \\le \\dot{V}_{s,max}||]\u003C/marimo-tex\u003E\u003Cul\u003E\n\u003Cli\u003E\u003Cstrong\u003ELower Bound = \u003Cmarimo-tex class=\"arithmatex\"\u003E||(0||)\u003C/marimo-tex\u003E, Upper Bound = \u003Cmarimo-tex class=\"arithmatex\"\u003E||(\\dot{V}_{s,max}||)\u003C/marimo-tex\u003E\u003C/strong\u003E\u003C/li\u003E\n\u003C/ul\u003E\n\u003Cspan class=\"paragraph\"\u003E\u003Cstrong\u003EIII. Constraint C: The ASHRAE Comfort Zone (Soft Inequality)\u003C/strong\u003E\u003C/span\u003E\n\u003Cspan class=\"paragraph\"\u003EThis implements your underactuated strategy. We tie the predicted \u003Cmarimo-tex class=\"arithmatex\"\u003E||(CO_2||)\u003C/marimo-tex\u003E and Humidity states to the slack variables.\u003C/span\u003E\n\u003Cmarimo-tex class=\"arithmatex\"\u003E||[C_{in, k} - \\epsilon_{c, k} \\le 1000||]\u003C/marimo-tex\u003E\u003Cmarimo-tex class=\"arithmatex\"\u003E||[W_{in, k} - \\epsilon_{w, k} \\le W_{max}||]\u003C/marimo-tex\u003E\u003Cul\u003E\n\u003Cli\u003E\u003Cstrong\u003ELower Bound = \u003Cmarimo-tex class=\"arithmatex\"\u003E||(-\\infty||)\u003C/marimo-tex\u003E, Upper Bound = \u003Cmarimo-tex class=\"arithmatex\"\u003E||(1000||)\u003C/marimo-tex\u003E (and \u003Cmarimo-tex class=\"arithmatex\"\u003E||(W_{max}||)\u003C/marimo-tex\u003E)\u003C/strong\u003E\u003C/li\u003E\n\u003Cli\u003E\u003Cem\u003ENote: We also mandate that slacks cannot be negative:\u003C/em\u003E \u003Cmarimo-tex class=\"arithmatex\"\u003E||(0 \\le \\epsilon \\le \\infty||)\u003C/marimo-tex\u003E.\u003C/li\u003E\n\u003C/ul\u003E\u003C/span\u003E"}, "type": "data"}]}], "metadata": {"marimo_version": "0.23.4", "script_metadata_hash": null}, "version": "1"},
            "runtimeConfig": null,
        }),
        writable: false,
        configurable: false,
      });
    </script>
