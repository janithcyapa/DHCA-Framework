      function __resizeIframe(obj) {
        const scrollbarHeight = 20; // Max between windows, mac, and linux

        function setHeight() {
          // Guard against race condition where iframe isn't ready
          if (!obj.contentWindow?.document?.documentElement) {
            return;
          }
          const element = obj.contentWindow.document.documentElement;
          // If there is no vertical scrollbar, we don't need to resize the iframe
          if (element.scrollHeight === element.clientHeight) {
            return;
          }

          // Create a new height that includes the scrollbar height if it's visible
          const hasHorizontalScrollbar = element.scrollWidth > element.clientWidth;
          const newHeight = element.scrollHeight + (hasHorizontalScrollbar ? scrollbarHeight : 0);

          // Only update the height if it's different from the current height
          if (obj.style.height !== `${newHeight}px`) {
            obj.style.height = `${newHeight}px`;
          }
        }

        // Resize the iframe to the height of the content and bottom scrollbar height
        setHeight();

        // Resize the iframe when the content changes
        const resizeObserver = new ResizeObserver((_entries) => {
          setHeight();
        });
        // Only observe if iframe content is ready
        if (obj.contentWindow?.document?.body) {
          resizeObserver.observe(obj.contentWindow.document.body);
        }
      }
    </script>

            "session": {"cells": [{"code_hash": "c7eab6d5485c136cad36e341160191ea", "console": [], "id": "Hbol", "outputs": [{"data": {"text/html": "\u003Cstyle\u003E/* Load fonts from Google Fonts */\n@import url(\"https://fonts.googleapis.com/css2?family=Inter:opsz,wght@14..32,300..800\u0026family=Fira+Code:wght@300..700\u0026display=swap\");\n\n/* Font and Radius Variables */\n:root {\n    --monospace-font: \"Fira Code\", monospace;\n    --text-font: \"Inter\", system-ui, -apple-system, \"Segoe UI\", \"Roboto\", \"Open Sans\", sans-serif;\n    --heading-font: \"Inter\", system-ui, -apple-system, \"Segoe UI\", \"Roboto\", \"Open Sans\", sans-serif;\n    --radius: 12px;\n}\n\n/* Mininini Theme Colors */\n:root {\n    /* Backgrounds - soft, not pure black */\n    --background: light-dark(#ffffff, #181a1c);\n    --background-darker: light-dark(#e5e5e5, #101214);\n    --foreground: light-dark(#0a0a0a, #eef2f5);\n    --muted: light-dark(#f0f0f0, #222528);\n    --muted-foreground: light-dark(#777777, #9aa3ae);\n\n    /* UI Elements */\n    --card: light-dark(#fafafa, #1e2124);\n    --card-foreground: light-dark(#222222, #eef2f5);\n    --popover: light-dark(#e8e8e8, #181a1c);\n    --popover-foreground: light-dark(#0f0f0f, #eef2f5);\n    --border: light-dark(#444444, #2e3236);\n    --input: light-dark(#f5f5f5, #131517);\n\n    /* Primary Colors */\n    --primary: light-dark(#1e40af, #3b82f6);\n    --primary-foreground: light-dark(#ffffff, #ffffff);\n    --secondary: light-dark(#475569, #6c7a91);\n    --secondary-foreground: light-dark(#ffffff, #f1f5f9);\n    --accent: light-dark(#f97316, #fb923c);\n    --accent-foreground: light-dark(#ffffff, #ffffff);\n\n    /* Heading Colors - All gray except H4 (orange) and H5 (blue) */\n    --h1-color: light-dark(#1f2937, #e5e7eb); /* Gray */\n    --h2-color: light-dark(#374151, #d1d5db); /* Gray */\n    --h3-color: light-dark(#4b5563, #9ca3af); /* Gray */\n    --h4-color: light-dark(#ea580c, #f97316); /* Orange accent */\n    --h5-color: light-dark(#2563eb, #60a5fa); /* Blue accent */\n    --h6-color: light-dark(#6b7280, #9ca3af); /* Gray (lighter) */\n\n    /* Code \u0026 Math Styling */\n    --inline-code-color: light-dark(#2563eb, #60a5fa);\n    --equation-color: light-dark(#6b7280, #9ca3af);\n\n    /* Semantic Colors */\n    --error: light-dark(#dc2626, #f87171);\n    --success: light-dark(#059669, #34d399);\n    --destructive: light-dark(#b91c1c, #ef4444);\n    --action: light-dark(#d97706, #fbbf24);\n    --link: light-dark(#2563eb, #3b82f6);\n    --link-visited: light-dark(#7c3aed, #a78bfa);\n\n    /* Shadows */\n    --base-shadow: light-dark(rgba(0, 0, 0, 0.08), rgba(0, 0, 0, 0.3));\n    --base-shadow-darker: light-dark(rgba(0, 0, 0, 0.12), rgba(0, 0, 0, 0.4));\n    --base-shadow-opacity: 8%;\n}\n\n/* Heading styles */\nh1, .h1 { \n    color: var(--h1-color); \n    font-weight: 800;\n    letter-spacing: -0.02em;\n}\n\nh2, .h2 { \n    color: var(--h2-color); \n    font-weight: 700;\n    letter-spacing: -0.01em;\n}\n\nh3, .h3 { \n    color: var(--h3-color); \n    font-weight: 600;\n}\n\nh4, .h4 { \n    color: var(--h4-color); /* Orange */\n    font-weight: 600; \n    letter-spacing: -0.01em; \n}\n\nh5, .h5 { \n    color: var(--h5-color); /* Blue */\n    font-weight: 500;\n}\n\nh6, .h6 { \n    color: var(--h6-color); /* Gray */\n    font-weight: 500;\n}\n\n/* Inline code styling - Blue */\ncode:not(pre code), .inline-code {\n    color: var(--inline-code-color);\n    font-family: var(--monospace-font);\n    background-color: var(--muted);\n    padding: 0.2em 0.4em;\n    border-radius: 6px;\n    font-size: 1.0em;\n    font-weight: 500;\n}\n\n/* Equation styling - Gray */\nmarimo-tex,\n.arithmatex,\n.marimo-tex,\n.katex,\n.katex *,\n.mjx-container,\nmjx-container,\n.math {\n    color: var(--equation-color) !important;\n    font-size: 1.0em;\n}\n\nmarimo-tex mjx-container,\nmarimo-tex .MathJax,\nmarimo-tex [class*=\"math\"] {\n    color: var(--equation-color) !important;\n    font-size: 1.0em;\n}\n\n.latex,\n.latex *,\n.tex,\n.tex * {\n    color: var(--equation-color) !important;\n    font-size: 1.0em;\n}\n\n/* Code blocks subtle blue tint */\npre code {\n    background-color: var(--background-darker);\n    border-left: 3px solid var(--primary);\n    font-size: 1.0em;\n}\n\n.markdown marimo-tex,\n.prose marimo-tex {\n    color: var(--equation-color) !important;\n    font-size: 1.0em;\n}\n\n/* =========================================\n   Global Table Styling (Marimo \"Nuclear\" Override)\n   ========================================= */\n\n/* Target the table container aggressively */\n:root body [class*=\"prose\"] table,\nmarimo-markdown table {\n    width: 100% !important;\n    border-collapse: collapse !important;\n    margin: 1.5em 0 !important;\n}\n\n/* Force Header Styles */\n:root body [class*=\"prose\"] th,\nmarimo-markdown th {\n    padding: 12px 16px !important;\n    border-bottom: 2px solid var(--border) !important;\n    color: var(--h3-color) !important;\n    font-weight: 600 !important;\n    background-color: transparent !important;\n    text-align: left !important;\n}\n\n/* Base Cell Styles */\n:root body [class*=\"prose\"] td,\nmarimo-markdown td {\n    padding: 12px 16px !important;\n    border-bottom: 1px solid var(--border) !important;\n    color: var(--foreground) !important;\n}\n\n/* Zebra Striping - Applied directly to the TD so Marimo can't cover it up */\n:root body [class*=\"prose\"] tbody tr:nth-child(odd) td,\nmarimo-markdown tbody tr:nth-child(odd) td {\n    background-color: var(--muted) !important;\n}\n\n:root body [class*=\"prose\"] tbody tr:nth-child(even) td,\nmarimo-markdown tbody tr:nth-child(even) td {\n    background-color: transparent !important;\n}\n\n/* Hover effect - Also applied to the TD */\n:root body [class*=\"prose\"] tbody tr:hover td,\nmarimo-markdown tbody tr:hover td {\n    background-color: var(--background-darker) !important;\n}\n\u003C/style\u003E"}, "type": "data"}]}, {"code_hash": "7b5dddda763eaaaaacddd8f4001d43a3", "console": [], "id": "WnPI", "outputs": [{"data": {"text/markdown": "\u003Cspan class=\"markdown prose dark:prose-invert contents\"\u003E\u003Cspan class=\"paragraph\"\u003E\u003Ca href=\"https://janithcyapa.github.io/DHCA-Framework/\" rel=\"noopener noreferrer\" target=\"_blank\"\u003E\ud83c\udfe0 Home\u003C/a\u003E\u003C/span\u003E\u003C/span\u003E"}, "type": "data"}]}, {"code_hash": "bd16769766716438e57a1d8a2e69f59e", "console": [], "id": "MJUe", "outputs": [{"data": {"text/markdown": "\u003Cspan class=\"markdown prose dark:prose-invert contents\"\u003E\u003Ch1 id=\"model-pridictive-control-for-the-thermal-zone\"\u003EModel Pridictive Control for the Thermal Zone\u003C/h1\u003E\u003C/span\u003E"}, "type": "data"}]}, {"code_hash": "f87bc927fd2634985f47dc946313cead", "console": [], "id": "vblA", "outputs": [{"data": {"text/markdown": "\u003Cspan class=\"markdown prose dark:prose-invert contents\"\u003E\u003Ch2 id=\"system-dynamic\"\u003ESystem Dynamic\u003C/h2\u003E\u003C/span\u003E"}, "type": "data"}]}, {"code_hash": "564d3456eba9b25d72f788004a6015ce", "console": [], "id": "bkHC", "outputs": [{"data": {"text/markdown": "\u003Cspan class=\"markdown prose dark:prose-invert contents\"\u003E\u003Ch3 id=\"11-system-dynamics-from-previous-calculations\"\u003E1.1 System Dynamics From Previous calculations\u003C/h3\u003E\n\u003Cspan class=\"paragraph\"\u003ETo remove all the parts that are difficult to measure and to estimate define all of them as and The lumped disturbance vector (\u003Cmarimo-tex class=\"arithmatex\"\u003E||(d_i||)\u003C/marimo-tex\u003E):\u003C/span\u003E\n\u003Cmarimo-tex class=\"arithmatex\"\u003E||[ d_{T,i} = Q_{solar,i} + Q_{\\text{inf},i} + Q_{equip,i} + \\sum \\dot{m}_{ij} c_p (T_{in,j} - T_{in,i}) + \\text{unmodeled conduction} \\tag{6(a)}||]\u003C/marimo-tex\u003E\u003Cmarimo-tex class=\"arithmatex\"\u003E||[ d_{W,i} = \\dot{m}_{inf,i}(W_{out} - W_{in,i}) + \\sum \\dot{m}_{mix,ij} (W_{in,j} - W_{in,i}) + \\text{unmodeled moisture leaks} \\tag{6(b)}||]\u003C/marimo-tex\u003E\u003Cmarimo-tex class=\"arithmatex\"\u003E||[ d_{C,i} = \\dot{V}_{inf,i}(C_{out} - C_{in,i}) + \\sum \\dot{V}_{mix,ij} (C_{in,j} - C_{in,i}) + \\text{unmodeled } CO_2 \\text{ leaks} \\tag{6(c)}||]\u003C/marimo-tex\u003E\u003Cspan class=\"paragraph\"\u003EThen our system becomes,\u003C/span\u003E\n\u003Cmarimo-tex class=\"arithmatex\"\u003E||[C_{\\text{air},i} \\ \\dot{T}_{in,i}=\n\\frac{T_{\\text{out}} - T_{in,i}}{R_{\\text{env,external},i}} +\n\\sum_{j \\in \\text{adj}(i)} \\frac{T_{in,j} - T_{in,i}}{R_{\\text{env,couple},ij}} +\n\\frac{T_{m,i} - T_{in,i}}{R_{\\text{int},i}} +\nN_{occ,i}\u22c5q_{person}+\n\\rho_{air} \\dot{V}_{s,i} \\ c_p \\ (T_s - T_{in,i}) +\nd_{T,i} \\tag{7}||]\u003C/marimo-tex\u003E\u003Cmarimo-tex class=\"arithmatex\"\u003E||[C_{\\text{mass},i} \\ \\dot{T}_{m,i}= \\frac{T_{in,i} - T_{m,i}}{R_{\\text{int},i}} \\tag{8}||]\u003C/marimo-tex\u003E\u003Cmarimo-tex class=\"arithmatex\"\u003E||[M_{air,i}\\ \\dot{W}_{in,i} =\nN_{occ,i} \u22c5g_{w,person} +\n\\dot{m}_{s,i}(W_s - W_{in,i}) +\nd_{W,i} \\tag{9}||]\u003C/marimo-tex\u003E\u003Cmarimo-tex class=\"arithmatex\"\u003E||[V_{room,i}  \\ \\dot{C}_{in,i} =\nN_{occ,i}\u22c5g_{co2,person} +\n\\dot{V}_{s,i}(C_{s} - C_{in,i}) +\nd_{C,i} \\tag{10}||]\u003C/marimo-tex\u003E\u003Cspan class=\"paragraph\"\u003E\u003Cem\u003E(Note: In this calculations I have removed \u003Cmarimo-tex class=\"arithmatex\"\u003E||(X_i||)\u003C/marimo-tex\u003E notation for simplicity.)\u003C/em\u003E\u003C/span\u003E\u003C/span\u003E"}, "type": "data"}]}, {"code_hash": "4e233d756038e83290e285a615862159", "console": [], "id": "lEQa", "outputs": [{"data": {"text/markdown": "\u003Cspan class=\"markdown prose dark:prose-invert contents\"\u003E\u003Ch2 id=\"mpc-design\"\u003EMPC Design\u003C/h2\u003E\u003C/span\u003E"}, "type": "data"}]}, {"code_hash": "87e4c7b1bebd0a249a01f9a76861bb47", "console": [], "id": "PKri", "outputs": [{"data": {"text/markdown": "\u003Cspan class=\"markdown prose dark:prose-invert contents\"\u003E\u003Ch3 id=\"1-state-and-disturbance-extraction\"\u003E1. State and Disturbance Extraction\u003C/h3\u003E\u003C/span\u003E"}, "type": "data"}]}, {"code_hash": "d21230a5f0e7742f16c24e1f3fff2b26", "console": [], "id": "Xref", "outputs": [{"data": {"text/markdown": "\u003Cspan class=\"markdown prose dark:prose-invert contents\"\u003E\u003Cspan class=\"paragraph\"\u003EAt the start of control interval k, the MPC read the optimal estimates from EKF.\nAt every control interval k, the EKF provides an augmented state vector, which the MPC splits into two distinct categories,\u003C/span\u003E\n\u003Cspan class=\"paragraph\"\u003EThe System States (\u003Cmarimo-tex class=\"arithmatex\"\u003E||(\\hat{x}_k||)\u003C/marimo-tex\u003E)\u003C/span\u003E\n\u003Cmarimo-tex class=\"arithmatex\"\u003E||[ \\hat{x}_k = \\begin{bmatrix} T_{in} \\\\ T_{m} \\\\ C_{in} \\\\ W_{in}  \\end{bmatrix} ||]\u003C/marimo-tex\u003E\u003Cspan class=\"paragraph\"\u003EUnmeasured Disturbances (\u003Cmarimo-tex class=\"arithmatex\"\u003E||(\\hat{d}_k||)\u003C/marimo-tex\u003E)\u003C/span\u003E\n\u003Cmarimo-tex class=\"arithmatex\"\u003E||[ \\hat{d}_k = \\begin{bmatrix}  d_{T} \\\\ d_{W} \\end{bmatrix} ||]\u003C/marimo-tex\u003E\u003Cspan class=\"paragraph\"\u003EThe Control Input (\u003Cmarimo-tex class=\"arithmatex\"\u003E||(u||)\u003C/marimo-tex\u003E)\u003C/span\u003E\n\u003Cmarimo-tex class=\"arithmatex\"\u003E||[ u = \\begin{bmatrix} \\dot{V}_s \\end{bmatrix}||]\u003C/marimo-tex\u003E\u003Cspan class=\"paragraph\"\u003EThe MPC assumes that whatever unmodeled disturbances are happening right now will remain constant across the entire future prediction horizon (\u003Cmarimo-tex class=\"arithmatex\"\u003E||(N_p||)\u003C/marimo-tex\u003E)\u003C/span\u003E\n\u003Cmarimo-tex class=\"arithmatex\"\u003E||[\\dot{x}(t)=f(x(t),u(t),d(t))||]\u003C/marimo-tex\u003E\u003Cspan class=\"paragraph\"\u003EIn Real-Time Iteration, we linearize around the current reality of the system at time step \u003Cmarimo-tex class=\"arithmatex\"\u003E||(k||)\u003C/marimo-tex\u003E. We freeze the system using the optimal estimates from the EKF (\u003Cmarimo-tex class=\"arithmatex\"\u003E||(\\hat{x}_{k\u2223k}||)\u003C/marimo-tex\u003E and \u003Cmarimo-tex class=\"arithmatex\"\u003E||(\\hat{d}_{k\u2223k}||)\u003C/marimo-tex\u003E) and the previously applied control action (\u003Cmarimo-tex class=\"arithmatex\"\u003E||(u_{k-1}||)\u003C/marimo-tex\u003E).\u003C/span\u003E\n\u003Cul\u003E\n\u003Cli\u003E\u003Cmarimo-tex class=\"arithmatex\"\u003E||(x_{op} = \\hat{x}_{k|k} = [\\hat{T}_{in}, \\hat{T}_m, \\hat{C}_{in}, \\hat{W}_{in}]^T||)\u003C/marimo-tex\u003E\u003C/li\u003E\n\u003Cli\u003E\u003Cmarimo-tex class=\"arithmatex\"\u003E||(u_{op} = u_{k-1}||)\u003C/marimo-tex\u003E\u003C/li\u003E\n\u003Cli\u003E\u003Cmarimo-tex class=\"arithmatex\"\u003E||(d_{op} = \\hat{d}_{k|k} = [\\hat{d}_T, \\hat{d}_W, 0]^T||)\u003C/marimo-tex\u003E\u003C/li\u003E\n\u003C/ul\u003E\u003C/span\u003E"}, "type": "data"}]}, {"code_hash": "a740b5ff3dbbda04504b574813ec9295", "console": [], "id": "SFPL", "outputs": [{"data": {"text/markdown": "\u003Cspan class=\"markdown prose dark:prose-invert contents\"\u003E\u003Ch3 id=\"2-successive-linearization\"\u003E2. Successive Linearization\u003C/h3\u003E\u003C/span\u003E"}, "type": "data"}]}, {"code_hash": "96668f16efc1ad31e6d122e94f9fbd59", "console": [], "id": "BYtC", "outputs": [{"data": {"text/markdown": "\u003Cspan class=\"markdown prose dark:prose-invert contents\"\u003E\u003Cspan class=\"paragraph\"\u003EStandard embedded solvers (like OSQP) only solve Quadratic Programs (QPs), which strictly require linear dynamics. So use Successive Linearization to linearize the dynamics.\u003C/span\u003E\n\u003Col\u003E\n\u003Cli\u003EThe State Jacobian \u003Cmarimo-tex class=\"arithmatex\"\u003E||(A_c||)\u003C/marimo-tex\u003E\u003C/li\u003E\n\u003C/ol\u003E\n\u003Cmarimo-tex class=\"arithmatex\"\u003E||[A_c = \\left. \\frac{\\partial f}{\\partial x} \\right|_{x_{op}, u_{op}, d_{op}}||]\u003C/marimo-tex\u003E\u003Cmarimo-tex class=\"arithmatex\"\u003E||[A_c = \\begin{bmatrix}\n\\frac{\\partial \\dot{T}{in}}{\\partial T{in}} \u0026amp; \\frac{\\partial \\dot{T}{in}}{\\partial T_m} \u0026amp; 0 \u0026amp; 0 \\\\\n\\frac{\\partial \\dot{T}m}{\\partial T{in}} \u0026amp; \\frac{\\partial \\dot{T}m}{\\partial T_m} \u0026amp; 0 \u0026amp; 0 \\\\\n0 \u0026amp; 0 \u0026amp; \\frac{\\partial \\dot{C}{in}}{\\partial C{in}} \u0026amp; 0 \\\\\n0 \u0026amp; 0 \u0026amp; 0 \u0026amp; \\frac{\\partial \\dot{W}{in}}{\\partial W{in}}\n\\end{bmatrix}||]\u003C/marimo-tex\u003E\u003Cmarimo-tex class=\"arithmatex\"\u003E||[A_c = \\begin{bmatrix}\n-\\frac{1}{C_{air,i}} \\left( \\frac{1}{R_{env,ext,i}} + \\sum \\frac{1}{R_{env,cpl,ij}} + \\frac{1}{R_{int,i}} + \\rho_{air} c_p \\dot{V}_{s,i,op} \\right) \u0026amp; \\frac{1}{C{air,i} R_{int,i}} \u0026amp; 0 \u0026amp; 0 \\\\\n\\frac{1}{C_{mass,i} R_{int,i}} \u0026amp; -\\frac{1}{C_{mass,i} R_{int,i}} \u0026amp; 0 \u0026amp; 0 \\\\\n0 \u0026amp; 0 \u0026amp; -\\frac{\\dot{V}_{s,i,op}}{V_{room,i}} \u0026amp; 0 \\\\\n0 \u0026amp; 0 \u0026amp; 0 \u0026amp; -\\frac{\\dot{m}_{s,i,op}}{M_{air,i}}\n\\end{bmatrix}||]\u003C/marimo-tex\u003E\u003Col start=\"2\"\u003E\n\u003Cli\u003EThe Input Jacobian \u003Cmarimo-tex class=\"arithmatex\"\u003E||(B_c||)\u003C/marimo-tex\u003E\u003C/li\u003E\n\u003C/ol\u003E\n\u003Cmarimo-tex class=\"arithmatex\"\u003E||[B_c = \\left. \\frac{\\partial f}{\\partial u} \\right|_{x_{op}, u_{op}, d_{op}}||]\u003C/marimo-tex\u003E\u003Cmarimo-tex class=\"arithmatex\"\u003E||[B_c = \\begin{bmatrix}\n\\frac{\\partial \\dot{T}{in}}{\\partial u} \\\\\n0 \\\\\n\\frac{\\partial \\dot{C}{in}}{\\partial u} \\\\\n\\frac{\\partial \\dot{W}_{in}}{\\partial u}\n\\end{bmatrix}||]\u003C/marimo-tex\u003E\u003Cmarimo-tex class=\"arithmatex\"\u003E||[B_c =  \\begin{bmatrix}\n\\frac{\\rho_{air} c_p (T_s - T_{in,i,op})}{C_{air,i}} \\\\\n0 \\\\\n\\frac{C_s - C_{in,i,op}}{V_{room,i}} \\\\\n\\frac{\\rho_{air} (W_s - W_{in,i,op})}{M_{air,i}}\n\\end{bmatrix}||]\u003C/marimo-tex\u003E\u003Col start=\"3\"\u003E\n\u003Cli\u003EThe Affine Drift Vector \u003Cmarimo-tex class=\"arithmatex\"\u003E||(C_c||)\u003C/marimo-tex\u003E\u003C/li\u003E\n\u003C/ol\u003E\n\u003Cspan class=\"paragraph\"\u003ETo complete the Taylor series, we calculate the continuous drift vector to capture the affine offset\u003C/span\u003E\n\u003Cmarimo-tex class=\"arithmatex\"\u003E||[c_c = f(x_{op}, u_{op}, d_{op}) - A_c x_{op} - B_c u_{op}||]\u003C/marimo-tex\u003E\u003Cspan class=\"paragraph\"\u003EThe locally linear continuous model is now mathematically perfectly flat at this exact millisecond\u003C/span\u003E\n\u003Cmarimo-tex class=\"arithmatex\"\u003E||[\\dot{x} = A_c x + B_c u + c_c||]\u003C/marimo-tex\u003E\u003C/span\u003E"}, "type": "data"}]}, {"code_hash": "fd71332ff05b771dce4dc0ba56482c6b", "console": [], "id": "RGSE", "outputs": [{"data": {"text/markdown": "\u003Cspan class=\"markdown prose dark:prose-invert contents\"\u003E\u003Ch3 id=\"3-discretization\"\u003E3. Discretization\u003C/h3\u003E\u003C/span\u003E"}, "type": "data"}]}, {"code_hash": "171defa65d3b90bb2333ac42a239f0f6", "console": [], "id": "Kclp", "outputs": [{"data": {"text/markdown": "\u003Cspan class=\"markdown prose dark:prose-invert contents\"\u003E\u003Cspan class=\"paragraph\"\u003EEmbedded QP solvers operate in discrete steps \u003Cmarimo-tex class=\"arithmatex\"\u003E||(i=0,1,\u2026,N_p||)\u003C/marimo-tex\u003E across the prediction horizon. We convert our continuous affine model (\u003Cmarimo-tex class=\"arithmatex\"\u003E||(\\dot{x}||)\u003C/marimo-tex\u003E) to a discrete model (\u003Cmarimo-tex class=\"arithmatex\"\u003E||(x_{i+1}||)\u003C/marimo-tex\u003E) using your controller's sampling time \u003Cmarimo-tex class=\"arithmatex\"\u003E||(T_s||)\u003C/marimo-tex\u003E.\u003C/span\u003E\n\u003Cspan class=\"paragraph\"\u003EUsing the Forward Euler approximation:\u003C/span\u003E\n\u003Cmarimo-tex class=\"arithmatex\"\u003E||[\\dot{x} \\approx \\frac{x_{i+1} - x_i}{T_s}||]\u003C/marimo-tex\u003E\u003Cspan class=\"paragraph\"\u003ESubstitute our affine continuous model:\u003C/span\u003E\n\u003Cmarimo-tex class=\"arithmatex\"\u003E||[\\frac{x_{i+1} - x_i}{T_s} = A_c x_i + B_c u_i + c_c||]\u003C/marimo-tex\u003E\u003Cspan class=\"paragraph\"\u003EMultiply by \u003Cmarimo-tex class=\"arithmatex\"\u003E||(T_s||)\u003C/marimo-tex\u003E and isolate \u003Cmarimo-tex class=\"arithmatex\"\u003E||(x_{i+1}||)\u003C/marimo-tex\u003E:\u003C/span\u003E\n\u003Cmarimo-tex class=\"arithmatex\"\u003E||[x_{i+1} = x_i + T_s A_c x_i + T_s B_c u_i + T_s c_c||]\u003C/marimo-tex\u003E\u003Cmarimo-tex class=\"arithmatex\"\u003E||[x_{i+1} = (I_{4 \\times 4} + T_s A_c)x_i + (T_s B_c)u_i + (T_s c_c)||]\u003C/marimo-tex\u003E\u003Cspan class=\"paragraph\"\u003EYielding the final discrete matrices:\u003C/span\u003E\n\u003Cul\u003E\n\u003Cli\u003E\u003Cmarimo-tex class=\"arithmatex\"\u003E||(A_d = I_{4 \\times 4} + T_s A_c||)\u003C/marimo-tex\u003E\u003C/li\u003E\n\u003Cli\u003E\u003Cmarimo-tex class=\"arithmatex\"\u003E||(B_d = T_s B_c||)\u003C/marimo-tex\u003E\u003C/li\u003E\n\u003Cli\u003E\u003Cmarimo-tex class=\"arithmatex\"\u003E||(c_d = T_s c_c||)\u003C/marimo-tex\u003E\u003C/li\u003E\n\u003C/ul\u003E\n\u003Cspan class=\"paragraph\"\u003ENote : \u003Cmarimo-tex class=\"arithmatex\"\u003E||(T_s||)\u003C/marimo-tex\u003E is chosen such that \u003Cmarimo-tex class=\"arithmatex\"\u003E||(|\u03bb_i(A_d)| \u0026lt; 1||)\u003C/marimo-tex\u003E for all eigenvalues,\nCheck : switch to \u003Cmarimo-tex class=\"arithmatex\"\u003E||(expm(A_c\u00b7T_s)||)\u003C/marimo-tex\u003E (matrix exponential / ZOH) for \u003Cmarimo-tex class=\"arithmatex\"\u003E||(A_d||)\u003C/marimo-tex\u003E and \u003Cmarimo-tex class=\"arithmatex\"\u003E||((A_c)\u207b\u00b9(A_d - I)\u00b7B_c||)\u003C/marimo-tex\u003E for \u003Cmarimo-tex class=\"arithmatex\"\u003E||(B_d||)\u003C/marimo-tex\u003E. ZOH is unconditionally stable for stable systems.\u003C/span\u003E\n\u003Cspan class=\"paragraph\"\u003EAt the current control interval \u003Cmarimo-tex class=\"arithmatex\"\u003E||(k||)\u003C/marimo-tex\u003E \u003Cmarimo-tex class=\"arithmatex\"\u003E||(A_d, B_d||)\u003C/marimo-tex\u003E, and \u003Cmarimo-tex class=\"arithmatex\"\u003E||(c_d||)\u003C/marimo-tex\u003E.\u003C/span\u003E\n\u003Cmarimo-tex class=\"arithmatex\"\u003E||[x_{i+1} = A_d x_i + B_d u_i + c_d||]\u003C/marimo-tex\u003E\u003C/span\u003E"}, "type": "data"}]}, {"code_hash": "2b002d71777b5a504db985f5d6c24ca7", "console": [], "id": "emfo", "outputs": [{"data": {"text/markdown": "\u003Cspan class=\"markdown prose dark:prose-invert contents\"\u003E\u003Ch3 id=\"4-offset-free-target-selector\"\u003E4. Offset-Free Target Selector\u003C/h3\u003E\u003C/span\u003E"}, "type": "data"}]}, {"code_hash": "0294c62de676f4a7612d026ecdc7cee9", "console": [], "id": "Hstk", "outputs": [{"data": {"text/markdown": "\u003Cspan class=\"markdown prose dark:prose-invert contents\"\u003E\u003Cspan class=\"paragraph\"\u003EIn standard MPC, the controller minimizes a cost function to drive the system states (\u003Cmarimo-tex class=\"arithmatex\"\u003E||(x||)\u003C/marimo-tex\u003E) directly to a setpoint (\u003Cmarimo-tex class=\"arithmatex\"\u003E||(y_{ref}||)\u003C/marimo-tex\u003E). But with disturbances the optimization solver will eventually balance the penalty of being slightly off-target against the penalty of using excessive fan energy. This results in a persistent gap between the actual room temperature and the setpoint, known as \u003Cstrong\u003Esteady-state error\u003C/strong\u003E or \u003Cstrong\u003Eoffset\u003C/strong\u003E.\u003C/span\u003E\n\u003Cspan class=\"paragraph\"\u003ETo eliminate this offset, the MPC must be coupled with the Extended Kalman Filter\u2019s (EKF) Disturbance Observer. By feeding the estimated disturbances (\u003Cmarimo-tex class=\"arithmatex\"\u003E||(\\hat{d}_T, \\hat{d}_W||)\u003C/marimo-tex\u003E) into the MPC, we can mathematically solve for an artificial steady-state target (\u003Cmarimo-tex class=\"arithmatex\"\u003E||(x_{ss}, u_{ss}||)\u003C/marimo-tex\u003E) that inherently pre-compensates for the invisible load. The MPC then tracks this shifted target rather than the zero-state.\u003C/span\u003E\u003C/span\u003E"}, "type": "data"}]}, {"code_hash": "a8eec9808f8de3a16a176f8ef1e8cb1f", "console": [], "id": "nWHF", "outputs": [{"data": {"text/markdown": "\u003Cspan class=\"markdown prose dark:prose-invert contents\"\u003E\u003Col\u003E\n\u003Cli\u003EThe Steady-State\u003C/li\u003E\n\u003C/ol\u003E\n\u003Cmarimo-tex class=\"arithmatex\"\u003E||[x_{k+1} = A_d x_k + B_d u_k + c_d||]\u003C/marimo-tex\u003E\u003Cspan class=\"paragraph\"\u003EThe affine drift vector \u003Cmarimo-tex class=\"arithmatex\"\u003E||(c_d||)\u003C/marimo-tex\u003E already contains the mathematical influence of the current unmeasured disturbances (\u003Cmarimo-tex class=\"arithmatex\"\u003E||(\\hat{d}_T, \\hat{d}_W||)\u003C/marimo-tex\u003E) extracted from the EKF.\u003C/span\u003E\n\u003Cspan class=\"paragraph\"\u003ETo find the steady-state targets, we set the condition where the system comes to a complete rest. At steady-state, the rate of change is zero, meaning the next state is identical to the current state:\u003C/span\u003E\n\u003Cmarimo-tex class=\"arithmatex\"\u003E||[x_{k+1} = x_k = x_{ss}||]\u003C/marimo-tex\u003E\u003Cspan class=\"paragraph\"\u003ESubstitute \u003Cmarimo-tex class=\"arithmatex\"\u003E||(x_{ss}||)\u003C/marimo-tex\u003E into the discrete dynamics equation:\u003C/span\u003E\n\u003Cmarimo-tex class=\"arithmatex\"\u003E||[x_{ss} = A_d x_{ss} + B_d u_{ss} + c_d||]\u003C/marimo-tex\u003E\u003Cmarimo-tex class=\"arithmatex\"\u003E||[x_{ss} - A_d x_{ss} - B_d u_{ss} = c_d||]\u003C/marimo-tex\u003E\u003Cspan class=\"paragraph\"\u003EEquation 1: The physical steady-state condition\u003C/span\u003E\n\u003Cmarimo-tex class=\"arithmatex\"\u003E||[(I - A_d)x_{ss} - B_d u_{ss} = c_d \\quad \\tag{01}||]\u003C/marimo-tex\u003E\u003C/span\u003E"}, "type": "data"}]}, {"code_hash": "893bb8fa18f95fec1de9c49e2408ee2d", "console": [], "id": "iLit", "outputs": [{"data": {"text/markdown": "\u003Cspan class=\"markdown prose dark:prose-invert contents\"\u003E\u003Col start=\"2\"\u003E\n\u003Cli\u003EThe Output Tracking Requirement\nWe do not need or want to track every state to a specific number. For instance, the exact temperature of the furniture (\u003Cmarimo-tex class=\"arithmatex\"\u003E||(T_m||)\u003C/marimo-tex\u003E) is irrelevant as long as the indoor air (\u003Cmarimo-tex class=\"arithmatex\"\u003E||(T_{in}||)\u003C/marimo-tex\u003E) is comfortable.\u003C/li\u003E\n\u003C/ol\u003E\n\u003Cspan class=\"paragraph\"\u003EWe define an output matrix \u003Cmarimo-tex class=\"arithmatex\"\u003E||(C_y||)\u003C/marimo-tex\u003E that extracts only the variables we want to actively track. For a 4-state system (\u003Cmarimo-tex class=\"arithmatex\"\u003E||(T_{in}, T_m, C_{in}, W_{in}||)\u003C/marimo-tex\u003E) with a priority on temperature control, we track only \u003Cmarimo-tex class=\"arithmatex\"\u003E||(T_{in}||)\u003C/marimo-tex\u003E:\u003C/span\u003E\n\u003Cmarimo-tex class=\"arithmatex\"\u003E||[C_y = \\begin{bmatrix} 1 \u0026amp; 0 \u0026amp; 0 \u0026amp; 0 \\end{bmatrix}||]\u003C/marimo-tex\u003E\u003Cspan class=\"paragraph\"\u003EWe mandate that our steady-state targets must perfectly equal our reference setpoint (\u003Cmarimo-tex class=\"arithmatex\"\u003E||(y_{ref}||)\u003C/marimo-tex\u003E):\u003C/span\u003E\n\u003Cspan class=\"paragraph\"\u003EEquation 2: The tracking condition\u003C/span\u003E\n\u003Cmarimo-tex class=\"arithmatex\"\u003E||[C_y x_{ss} = y_{ref} \\quad \\tag{2}||]\u003C/marimo-tex\u003E\u003Col start=\"3\"\u003E\n\u003Cli\u003EThe Augmented Linear System\n4.\nCombine Equation 1 and Equation 2 into a single block-matrix formulation:\u003C/li\u003E\n\u003C/ol\u003E\n\u003Cmarimo-tex class=\"arithmatex\"\u003E||[\\begin{bmatrix} I - A_d \u0026amp; -B_d \\\\ C_y \u0026amp; 0 \\end{bmatrix} \\begin{bmatrix} x_{ss} \\\\ u_{ss} \\end{bmatrix} = \\begin{bmatrix} c_d \\\\ y_{ref} \\end{bmatrix}||]\u003C/marimo-tex\u003E\u003Cspan class=\"paragraph\"\u003Ewe can solve this system of equations at every time step using standard LU decomposition\u003C/span\u003E\n\u003Cmarimo-tex class=\"arithmatex\"\u003E||[\\begin{bmatrix} x_{ss} \\\\ u_{ss} \\end{bmatrix} = \\begin{bmatrix} I - A_d \u0026amp; -B_d \\\\ C_y \u0026amp; 0 \\end{bmatrix}^{-1} \\begin{bmatrix} c_d \\\\ y_{ref} \\end{bmatrix}||]\u003C/marimo-tex\u003E\u003Ch5 id=\"the-physical-result\"\u003EThe Physical Result\u003C/h5\u003E\n\u003Cspan class=\"paragraph\"\u003EBy solving this matrix, the controller identifies exactly how far open the damper must be (\u003Cmarimo-tex class=\"arithmatex\"\u003E||(u_{ss}||)\u003C/marimo-tex\u003E) to perfectly counter the human body heat currently recorded in \u003Cmarimo-tex class=\"arithmatex\"\u003E||(c_d||)\u003C/marimo-tex\u003E, while mathematically guaranteeing that \u003Cmarimo-tex class=\"arithmatex\"\u003E||(T_{in}||)\u003C/marimo-tex\u003E settles exactly at the desired \u003Cmarimo-tex class=\"arithmatex\"\u003E||(T_{ref}||)\u003C/marimo-tex\u003E.\u003C/span\u003E\u003C/span\u003E"}, "type": "data"}]}, {"code_hash": "6cf6ca23e6040e1d7a1b121df5ae35d2", "console": [], "id": "ZHCJ", "outputs": [{"data": {"text/markdown": "\u003Cspan class=\"markdown prose dark:prose-invert contents\"\u003E\u003Ch4 id=\"note-on-underactuation-and-matrix-rank\"\u003E\u003Cstrong\u003ENote on Underactuation and Matrix Rank\u003C/strong\u003E\u003C/h4\u003E\n\u003Cspan class=\"paragraph\"\u003EWith a single Variable Air Volume (VAV) damper (\u003Cmarimo-tex class=\"arithmatex\"\u003E||(\\dot{V}_s||)\u003C/marimo-tex\u003E), the system is underactuated. We cannot simultaneously force the temperature, the CO2, and the humidity to setpoint  using one stream of air.\u003C/span\u003E\n\u003Cspan class=\"paragraph\"\u003ETherefore, in the Target Selector:\u003C/span\u003E\n\u003Cul\u003E\n\u003Cli\u003E\u003Cstrong\u003EPriority 1 (Temperature):\u003C/strong\u003E Placed directly in the \u003Cmarimo-tex class=\"arithmatex\"\u003E||(C_y||)\u003C/marimo-tex\u003E tracking matrix to determine the steady-state baseline.\u003C/li\u003E\n\u003Cli\u003E\u003Cstrong\u003EPriority 2 \u0026amp; 3 (CO2 and Humidity):\u003C/strong\u003E Dropped from the Target Selector entirely. Instead, they are handled in the Quadratic Program (QP) as hard or soft inequality constraints (e.g., \u003Cmarimo-tex class=\"arithmatex\"\u003E||(C_{in} \\leq 1000||)\u003C/marimo-tex\u003E ppm). The QP solver will seamlessly maintain the perfect temperature trajectory calculated by the Target Selector until a safety boundary is reached, at which point it will mathematically sacrifice the temperature setpoint to flush the room with fresh air.\u003C/li\u003E\n\u003C/ul\u003E\u003C/span\u003E"}, "type": "data"}]}, {"code_hash": "87aa4505d7f7003f20ec4cc275ac10d2", "console": [], "id": "ROlb", "outputs": [{"data": {"text/markdown": "\u003Cspan class=\"markdown prose dark:prose-invert contents\"\u003E\u003Ch3 id=\"5-formulate-the-optimal-control-problem-ocp\"\u003E5. Formulate the Optimal Control Problem (OCP)\u003C/h3\u003E\u003C/span\u003E"}, "type": "data"}]}, {"code_hash": "fecfee7cde5ba15e9e021d2fc7a9f6fe", "console": [], "id": "qnkX", "outputs": [{"data": {"text/markdown": "\u003Cspan class=\"markdown prose dark:prose-invert contents\"\u003E\u003Cspan class=\"paragraph\"\u003EThe predictive controller must calculate the optimal sequence of future damper positions over a prediction horizon \u003Cmarimo-tex class=\"arithmatex\"\u003E||(N_p||)\u003C/marimo-tex\u003E. It does this by solving a constrained Quadratic Program (QP).\u003C/span\u003E\n\u003Col\u003E\n\u003Cli\u003EDefine the Error Variables\u003C/li\u003E\n\u003C/ol\u003E\n\u003Cspan class=\"paragraph\"\u003EWe want to penalize the system for deviating from the optimal steady-state targets (\u003Cmarimo-tex class=\"arithmatex\"\u003E||(x_{ss}, u_{ss}||)\u003C/marimo-tex\u003E) computed by the Target Selector.\u003C/span\u003E\n\u003Cspan class=\"paragraph\"\u003EDefine the deviation variables for the states, the input, and the input slew rate:\u003C/span\u003E\n\u003Cmarimo-tex class=\"arithmatex\"\u003E||[\\Delta x_i = x_i - x_{ss}||]\u003C/marimo-tex\u003E\u003Cmarimo-tex class=\"arithmatex\"\u003E||[\\Delta u_i = u_i - u_{ss}||]\u003C/marimo-tex\u003E\u003Cmarimo-tex class=\"arithmatex\"\u003E||[\\delta u_i = u_i - u_{i-1}||]\u003C/marimo-tex\u003E\u003C/span\u003E"}, "type": "data"}]}, {"code_hash": "18404d840bd4b6602a714a706b45e45a", "console": [], "id": "TqIu", "outputs": [{"data": {"text/markdown": "\u003Cspan class=\"markdown prose dark:prose-invert contents\"\u003E\u003Col start=\"2\"\u003E\n\u003Cli\u003EThe Quadratic Cost Function (\u003Cmarimo-tex class=\"arithmatex\"\u003E||(J||)\u003C/marimo-tex\u003E)\u003C/li\u003E\n\u003C/ol\u003E\n\u003Cspan class=\"paragraph\"\u003EThe objective is to minimize the total cost across the entire horizon (\u003Cmarimo-tex class=\"arithmatex\"\u003E||(i = 0||)\u003C/marimo-tex\u003E to \u003Cmarimo-tex class=\"arithmatex\"\u003E||(N_p - 1||)\u003C/marimo-tex\u003E), plus a terminal cost at the end of the horizon (\u003Cmarimo-tex class=\"arithmatex\"\u003E||(N_p||)\u003C/marimo-tex\u003E) to guarantee mathematical stability.\u003C/span\u003E\n\u003Cspan class=\"paragraph\"\u003ETo prevent the embedded solver from crashing if the air quality and humidity constraints become impossible to satisfy simultaneously (e.g., if the supply air itself is humid), we must introduce \u003Cstrong\u003Eslack variables\u003C/strong\u003E (\u003Cmarimo-tex class=\"arithmatex\"\u003E||(\\epsilon_c||)\u003C/marimo-tex\u003E and \u003Cmarimo-tex class=\"arithmatex\"\u003E||(\\epsilon_w||)\u003C/marimo-tex\u003E) to create \"soft constraints.\"\u003C/span\u003E\n\u003Cmarimo-tex class=\"arithmatex\"\u003E||[J = \\sum_{i=0}^{N_p-1} \\left( \\Delta x_i^T Q \\Delta x_i + \\Delta u_i^T R \\Delta u_i + \\delta u_i^T R_{\\Delta} \\delta u_i \\right) + \\Delta x_{N_p}^T P \\Delta x_{N_p} + \\rho_c \\epsilon_c^2 + \\rho_w \\epsilon_w^2||]\u003C/marimo-tex\u003E\u003Cblockquote\u003E\n\u003Cspan class=\"paragraph\"\u003EThe Weighting Matrices\u003C/span\u003E\n\u003C/blockquote\u003E\n\u003Cul\u003E\n\u003Cli\u003E\u003Cmarimo-tex class=\"arithmatex\"\u003E||(Q \\in \\mathbb{R}^{4 \\times 4}||)\u003C/marimo-tex\u003E \u003Cstrong\u003E(State Penalty):\u003C/strong\u003E A diagonal matrix.\u003Cul\u003E\n\u003Cli\u003E\u003Cmarimo-tex class=\"arithmatex\"\u003E||(Q_{1,1}||)\u003C/marimo-tex\u003E (for \u003Cmarimo-tex class=\"arithmatex\"\u003E||(T_{in}||)\u003C/marimo-tex\u003E): Set very high. The controller must aggressively track the temperature target.\u003C/li\u003E\n\u003Cli\u003E\u003Cmarimo-tex class=\"arithmatex\"\u003E||(Q_{2,2}||)\u003C/marimo-tex\u003E (for \u003Cmarimo-tex class=\"arithmatex\"\u003E||(T_m||)\u003C/marimo-tex\u003E): Set moderately. Keeps the thermal mass stable and prevents aggressive temperature swings.\u003C/li\u003E\n\u003Cli\u003E\u003Cmarimo-tex class=\"arithmatex\"\u003E||(Q_{3,3}||)\u003C/marimo-tex\u003E and \u003Cmarimo-tex class=\"arithmatex\"\u003E||(Q_{4,4}||)\u003C/marimo-tex\u003E (for \u003Cmarimo-tex class=\"arithmatex\"\u003E||(C_{in}||)\u003C/marimo-tex\u003E and \u003Cmarimo-tex class=\"arithmatex\"\u003E||(W_{in}||)\u003C/marimo-tex\u003E): Set to exactly \u003Cstrong\u003Ezero\u003C/strong\u003E. We do \u003Cem\u003Enot\u003C/em\u003E want the cost function trying to track a specific steady-state CO2 or Humidity number. We only care about their boundaries.\u003C/li\u003E\n\u003C/ul\u003E\n\u003C/li\u003E\n\u003Cli\u003E\u003Cmarimo-tex class=\"arithmatex\"\u003E||(R \\in \\mathbb{R}^{1 \\times 1}||)\u003C/marimo-tex\u003E \u003Cstrong\u003E(Input Penalty):\u003C/strong\u003E Penalizes using excessive supply air (\u003Cmarimo-tex class=\"arithmatex\"\u003E||(\\dot{V}_s||)\u003C/marimo-tex\u003E), implicitly saving fan energy and preventing overcooling.\u003C/li\u003E\n\u003Cli\u003E\u003Cmarimo-tex class=\"arithmatex\"\u003E||(R_{\\Delta} \\in \\mathbb{R}^{1 \\times 1}||)\u003C/marimo-tex\u003E \u003Cstrong\u003E(Slew Rate Penalty):\u003C/strong\u003E Heavily penalizes rapid changes in the damper position, preventing mechanical wear and tear on the VAV box motor.\u003C/li\u003E\n\u003Cli\u003E\u003Cmarimo-tex class=\"arithmatex\"\u003E||(\\rho_c, \\rho_w||)\u003C/marimo-tex\u003E \u003Cstrong\u003E(Slack Penalties):\u003C/strong\u003E Massive scalar weights (e.g., \u003Cmarimo-tex class=\"arithmatex\"\u003E||(10^6||)\u003C/marimo-tex\u003E) applied to the slack variables. This guarantees the solver will only violate the CO2 or Humidity boundaries if the mathematical problem becomes literally impossible.\u003C/li\u003E\n\u003C/ul\u003E\u003C/span\u003E"}, "type": "data"}]}, {"code_hash": "6eb8c024af5500cb1b8f74f04860e707", "console": [], "id": "Vxnm", "outputs": [{"data": {"text/markdown": "\u003Cspan class=\"markdown prose dark:prose-invert contents\"\u003E\u003Col start=\"3\"\u003E\n\u003Cli\u003EDefine the Constraints\u003C/li\u003E\n\u003C/ol\u003E\n\u003Cspan class=\"paragraph\"\u003EThe solver minimizes the cost function \u003Cmarimo-tex class=\"arithmatex\"\u003E||(J||)\u003C/marimo-tex\u003E subject to the physical realities of the room and the mechanical system. These constraints are enforced at every step \u003Cmarimo-tex class=\"arithmatex\"\u003E||(i||)\u003C/marimo-tex\u003E in the prediction horizon.\u003C/span\u003E\n\u003Cspan class=\"paragraph\"\u003E**A. Initialization: **\nThe starting point is explicitly locked to the current EKF estimates.\u003C/span\u003E\n\u003Cmarimo-tex class=\"arithmatex\"\u003E||[x_0 = \\begin{bmatrix} \\hat{T}_{in} \\\\ \\hat{T}_m \\\\ \\hat{C}_{in} \\\\ \\hat{W}_{in} \\end{bmatrix}_{k|k}||]\u003C/marimo-tex\u003E\u003Cspan class=\"paragraph\"\u003E\u003Cstrong\u003EB. System Dynamics (Equality Constraint):\u003C/strong\u003E\nThe future states must obey the discrete, locally linear physics we derived via the Taylor series expansion.\u003C/span\u003E\n\u003Cmarimo-tex class=\"arithmatex\"\u003E||[x_{i+1} = A_d x_i + B_d u_i + c_d||]\u003C/marimo-tex\u003E\u003Cspan class=\"paragraph\"\u003E\u003Cstrong\u003EC. Actuator Limits (Hard Inequality Constraint):\u003C/strong\u003E\nThe damper cannot open more than 100%, and it cannot supply negative air.\u003C/span\u003E\n\u003Cmarimo-tex class=\"arithmatex\"\u003E||[0 \\leq u_i \\leq \\dot{V}_{s,max}||]\u003C/marimo-tex\u003E\u003Cspan class=\"paragraph\"\u003E\u003Cstrong\u003ED. Slew Rate Limits (Hard Inequality Constraint):\u003C/strong\u003E\nThe physical speed of the damper motor restricts how far it can move in one sample time (\u003Cmarimo-tex class=\"arithmatex\"\u003E||(T_s||)\u003C/marimo-tex\u003E).\u003C/span\u003E\n\u003Cmarimo-tex class=\"arithmatex\"\u003E||[-\\Delta u_{max} \\leq \\delta u_i \\leq \\Delta u_{max}||]\u003C/marimo-tex\u003E\u003Cspan class=\"paragraph\"\u003E\u003Cstrong\u003EE. Air Quality Bounds (Soft Inequality Constraint - Priority 2):\u003C/strong\u003E\nEnsures the room remains safe for human occupancy per ASHRAE standards. If the room hits 1000 ppm, the slack variable \u003Cmarimo-tex class=\"arithmatex\"\u003E||(\\epsilon_c||)\u003C/marimo-tex\u003E engages, forcing the solver to sacrifice the temperature tracking to flush the room with fresh air.\u003C/span\u003E\n\u003Cmarimo-tex class=\"arithmatex\"\u003E||[C_{in,i} \\leq 1000 + \\epsilon_c||]\u003C/marimo-tex\u003E\u003Cmarimo-tex class=\"arithmatex\"\u003E||[\\epsilon_c \\geq 0||]\u003C/marimo-tex\u003E\u003Cspan class=\"paragraph\"\u003E\u003Cstrong\u003EF. Humidity Bounds (Soft Inequality Constraint - Priority 3):\u003C/strong\u003E\nEnsures the room does not become uncomfortably humid.\u003C/span\u003E\n\u003Cmarimo-tex class=\"arithmatex\"\u003E||[W_{in,i} \\leq W_{max} + \\epsilon_w||]\u003C/marimo-tex\u003E\u003Cmarimo-tex class=\"arithmatex\"\u003E||[\\epsilon_w \\geq 0||]\u003C/marimo-tex\u003E\u003C/span\u003E"}, "type": "data"}]}, {"code_hash": "cd54ed4d57205d19739b466e73ad911b", "console": [], "id": "DnEU", "outputs": [{"data": {"text/markdown": "\u003Cspan class=\"markdown prose dark:prose-invert contents\"\u003E\u003Ch3 id=\"6-dense-vectorization-standard-qp-form\"\u003E6. Dense Vectorization (Standard QP Form)\u003C/h3\u003E\u003C/span\u003E"}, "type": "data"}]}, {"code_hash": "c2b1f6f098090cf07f98afd037060794", "console": [], "id": "ulZA", "outputs": [{"data": {"text/markdown": "\u003Cspan class=\"markdown prose dark:prose-invert contents\"\u003E\u003Cspan class=\"paragraph\"\u003EEmbedded solvers only understand linear algebra arrays in a highly specific, standardized format known as the \u003Cstrong\u003EStandard Sparse QP Formulation\u003C/strong\u003E.\u003C/span\u003E\n\u003Cspan class=\"paragraph\"\u003EEvery QP solver requires the problem to be formatted as,\u003C/span\u003E\n\u003Cmarimo-tex class=\"arithmatex\"\u003E||[\\min_{Z} \\frac{1}{2} Z^T H Z + q^T Z||]\u003C/marimo-tex\u003E\u003Cmarimo-tex class=\"arithmatex\"\u003E||[\\text{subject to:} \\quad l \\le G Z \\le u_{bounds}||]\u003C/marimo-tex\u003E\u003Col\u003E\n\u003Cli\u003EDefine the Global Decision Vector (\u003Cmarimo-tex class=\"arithmatex\"\u003E||(Z||)\u003C/marimo-tex\u003E)\nThe solver needs a single vector containing everything it has the power to decide or predict across the entire horizon (\u003Cmarimo-tex class=\"arithmatex\"\u003E||(N_p||)\u003C/marimo-tex\u003E).\u003C/li\u003E\n\u003C/ol\u003E\n\u003Cspan class=\"paragraph\"\u003EAt each time step \u003Cmarimo-tex class=\"arithmatex\"\u003E||(i||)\u003C/marimo-tex\u003E, group the state variables, the control input, and our two soft-constraint slack variables (\u003Cmarimo-tex class=\"arithmatex\"\u003E||(\\epsilon_c, \\epsilon_w||)\u003C/marimo-tex\u003E) into a stage vector \u003Cmarimo-tex class=\"arithmatex\"\u003E||(z_i||)\u003C/marimo-tex\u003E:\u003C/span\u003E\n\u003Cmarimo-tex class=\"arithmatex\"\u003E||[z_i = \\begin{bmatrix} x_i \\\\ u_i \\\\ \\epsilon_{c,i} \\\\ \\epsilon_{w,i} \\end{bmatrix} \\in \\mathbb{R}^7||]\u003C/marimo-tex\u003E\u003Cspan class=\"paragraph\"\u003EStack these stage vectors from \u003Cmarimo-tex class=\"arithmatex\"\u003E||(i=0||)\u003C/marimo-tex\u003E to the end of the horizon \u003Cmarimo-tex class=\"arithmatex\"\u003E||(N_p||)\u003C/marimo-tex\u003E to create the global decision vector \u003Cmarimo-tex class=\"arithmatex\"\u003E||(Z||)\u003C/marimo-tex\u003E:\u003C/span\u003E\n\u003Cmarimo-tex class=\"arithmatex\"\u003E||[Z = \\begin{bmatrix} z_0 \\\\ z_1 \\\\ \\vdots \\\\ z_{N_p-1} \\\\ x_{N_p} \\end{bmatrix}||]\u003C/marimo-tex\u003E\u003Cspan class=\"paragraph\"\u003E\u003Cem\u003E(Note: The terminal step \u003Cmarimo-tex class=\"arithmatex\"\u003E||(N_p||)\u003C/marimo-tex\u003E only contains states, no inputs or slacks).\u003C/em\u003E\u003C/span\u003E\u003C/span\u003E"}, "type": "data"}]}, {"code_hash": "a9b004c4024b672fe0c17dd9a2c9ee0b", "console": [], "id": "ecfG", "outputs": [{"data": {"text/markdown": "\u003Cspan class=\"markdown prose dark:prose-invert contents\"\u003E\u003Col start=\"2\"\u003E\n\u003Cli\u003EConstruct the Hessian Matrix (\u003Cmarimo-tex class=\"arithmatex\"\u003E||(H||)\u003C/marimo-tex\u003E)\nThe Hessian matrix defines the quadratic costs (the \u003Cmarimo-tex class=\"arithmatex\"\u003E||(Q, R,||)\u003C/marimo-tex\u003E and \u003Cmarimo-tex class=\"arithmatex\"\u003E||(\\rho||)\u003C/marimo-tex\u003E penalties). Because there is no cross-penalty between time step \u003Cmarimo-tex class=\"arithmatex\"\u003E||(i||)\u003C/marimo-tex\u003E and time step \u003Cmarimo-tex class=\"arithmatex\"\u003E||(i+1||)\u003C/marimo-tex\u003E, \u003Cmarimo-tex class=\"arithmatex\"\u003E||(H||)\u003C/marimo-tex\u003E is a \u003Cstrong\u003Eblock-diagonal\u003C/strong\u003E matrix.\u003C/li\u003E\n\u003C/ol\u003E\n\u003Cspan class=\"paragraph\"\u003EFor a single stage \u003Cmarimo-tex class=\"arithmatex\"\u003E||(i||)\u003C/marimo-tex\u003E, the local Hessian \u003Cmarimo-tex class=\"arithmatex\"\u003E||(H_i||)\u003C/marimo-tex\u003E is:\u003C/span\u003E\n\u003Cmarimo-tex class=\"arithmatex\"\u003E||[ H_i = \\begin{bmatrix}\nQ_{4 \\times 4} \u0026amp; 0 \u0026amp; 0 \u0026amp; 0 \\\\\n0 \u0026amp; R_{1 \\times 1} \u0026amp; 0 \u0026amp; 0 \\\\\n0 \u0026amp; 0 \u0026amp; \\rho_c \u0026amp; 0 \\\\\n0 \u0026amp; 0 \u0026amp; 0 \u0026amp; \\rho_w\n\\end{bmatrix} ||]\u003C/marimo-tex\u003E\u003Cspan class=\"paragraph\"\u003EThe global Hessian \u003Cmarimo-tex class=\"arithmatex\"\u003E||(H||)\u003C/marimo-tex\u003E is constructed by placing these blocks along the diagonal, ending with the terminal penalty \u003Cmarimo-tex class=\"arithmatex\"\u003E||(P||)\u003C/marimo-tex\u003E:\u003C/span\u003E\n\u003Cmarimo-tex class=\"arithmatex\"\u003E||[H = \\text{blockdiag}(H_0, H_1, \\dots, H_{N_p-1}, P)||]\u003C/marimo-tex\u003E\u003C/span\u003E"}, "type": "data"}]}, {"code_hash": "615da06e46fb7b573baf04b504d9e351", "console": [], "id": "Pvdt", "outputs": [{"data": {"text/markdown": "\u003Cspan class=\"markdown prose dark:prose-invert contents\"\u003E\u003Col start=\"3\"\u003E\n\u003Cli\u003EConstruct the Gradient Vector (\u003Cmarimo-tex class=\"arithmatex\"\u003E||(q||)\u003C/marimo-tex\u003E)\u003C/li\u003E\n\u003C/ol\u003E\n\u003Cspan class=\"paragraph\"\u003EThe \u003Cmarimo-tex class=\"arithmatex\"\u003E||(H||)\u003C/marimo-tex\u003E matrix penalizes deviation from \u003Cem\u003Ezero\u003C/em\u003E. But we don't want to drive the room to zero, we want to drive it to the steady-state targets (\u003Cmarimo-tex class=\"arithmatex\"\u003E||(x_{ss}, u_{ss}||)\u003C/marimo-tex\u003E) computed by the Target Selector.\u003C/span\u003E\n\u003Cspan class=\"paragraph\"\u003EThe linear gradient vector \u003Cmarimo-tex class=\"arithmatex\"\u003E||(q||)\u003C/marimo-tex\u003E shifts the quadratic so its minimum rests on target.\u003C/span\u003E\n\u003Cspan class=\"paragraph\"\u003EFor a single stage \u003Cmarimo-tex class=\"arithmatex\"\u003E||(i||)\u003C/marimo-tex\u003E, the local target vector is:\u003C/span\u003E\n\u003Cmarimo-tex class=\"arithmatex\"\u003E||[z_{ss} = \\begin{bmatrix} x_{ss} \\\\ u_{ss} \\\\ 0 \\\\ 0 \\end{bmatrix}||]\u003C/marimo-tex\u003E\u003Cspan class=\"paragraph\"\u003EThe local gradient \u003Cmarimo-tex class=\"arithmatex\"\u003E||(q_i||)\u003C/marimo-tex\u003E is calculated as:\u003C/span\u003E\n\u003Cmarimo-tex class=\"arithmatex\"\u003E||[q_i = -H_i z_{ss}||]\u003C/marimo-tex\u003E\u003Cspan class=\"paragraph\"\u003EThe global gradient vector \u003Cmarimo-tex class=\"arithmatex\"\u003E||(q||)\u003C/marimo-tex\u003E is simply stacked:\u003C/span\u003E\n\u003Cmarimo-tex class=\"arithmatex\"\u003E||[q = \\begin{bmatrix} q_0 \\\\ q_1 \\\\ \\vdots \\\\ q_{N_p-1} \\\\ -P x_{ss} \\end{bmatrix}||]\u003C/marimo-tex\u003E\u003C/span\u003E"}, "type": "data"}]}, {"code_hash": "792423379b37f41dd5cf782d196ee9a7", "console": [], "id": "ZBYS", "outputs": [{"data": {"text/markdown": "\u003Cspan class=\"markdown prose dark:prose-invert contents\"\u003E\u003Col start=\"4\"\u003E\n\u003Cli\u003EConstruct the Constraint Matrix (\u003Cmarimo-tex class=\"arithmatex\"\u003E||(G||)\u003C/marimo-tex\u003E) and Bounds (\u003Cmarimo-tex class=\"arithmatex\"\u003E||(l, u_{bounds}||)\u003C/marimo-tex\u003E)\u003C/li\u003E\n\u003C/ol\u003E\n\u003Cspan class=\"paragraph\"\u003EThe matrix \u003Cmarimo-tex class=\"arithmatex\"\u003E||(G||)\u003C/marimo-tex\u003E enforces both the physical equations (equalities) and the safety limits (inequalities) simultaneously.\u003C/span\u003E\n\u003Cspan class=\"paragraph\"\u003EFor the QP solver, an equality constraint is just an inequality where the upper and lower bounds are identical (\u003Cmarimo-tex class=\"arithmatex\"\u003E||(l = u_{bounds}||)\u003C/marimo-tex\u003E).\u003C/span\u003E\n\u003Cspan class=\"paragraph\"\u003E\u003Cstrong\u003EA. Initial Condition (Equality):\u003C/strong\u003E\u003C/span\u003E\n\u003Cspan class=\"paragraph\"\u003EThe first constraint locks the starting state to the EKF output.\u003C/span\u003E\n\u003Cul\u003E\n\u003Cli\u003E\u003Cmarimo-tex class=\"arithmatex\"\u003E||(x_0 = \\hat{x}_{k|k}||)\u003C/marimo-tex\u003E\u003C/li\u003E\n\u003Cli\u003ELower Bound = Upper Bound = \u003Cmarimo-tex class=\"arithmatex\"\u003E||(\\hat{x}_{k|k}||)\u003C/marimo-tex\u003E\u003C/li\u003E\n\u003C/ul\u003E\n\u003Cspan class=\"paragraph\"\u003E\u003Cstrong\u003EB. System Dynamics (Equality):\u003C/strong\u003E\u003C/span\u003E\n\u003Cspan class=\"paragraph\"\u003EThe solver must obey Taylor-series physics:\u003C/span\u003E\n\u003Cmarimo-tex class=\"arithmatex\"\u003E||[x_{i+1} - A_d x_i - B_d u_i = c_d||]\u003C/marimo-tex\u003E\u003Cspan class=\"paragraph\"\u003EThis creates a diagonal band of \u003Cmarimo-tex class=\"arithmatex\"\u003E||(-A_d||)\u003C/marimo-tex\u003E and \u003Cmarimo-tex class=\"arithmatex\"\u003E||(-B_d||)\u003C/marimo-tex\u003E blocks shifting one step to the right, enforcing the transition from step \u003Cmarimo-tex class=\"arithmatex\"\u003E||(i||)\u003C/marimo-tex\u003E to \u003Cmarimo-tex class=\"arithmatex\"\u003E||(i+1||)\u003C/marimo-tex\u003E.\u003C/span\u003E\n\u003Cspan class=\"paragraph\"\u003ELower Bound = Upper Bound = \u003Cmarimo-tex class=\"arithmatex\"\u003E||(c_d||)\u003C/marimo-tex\u003E\u003C/span\u003E\n\u003Cspan class=\"paragraph\"\u003E\u003Cstrong\u003EC. Actuator and Slew Limits (Inequalities):\u003C/strong\u003E\u003C/span\u003E\n\u003Cspan class=\"paragraph\"\u003EThe matrix pulls out \u003Cmarimo-tex class=\"arithmatex\"\u003E||(u_i||)\u003C/marimo-tex\u003E and applies the limits.\u003C/span\u003E\n\u003Cul\u003E\n\u003Cli\u003E\u003Cmarimo-tex class=\"arithmatex\"\u003E||(0 \\le u_i \\le \\dot{V}_{s,max}||)\u003C/marimo-tex\u003E\u003C/li\u003E\n\u003Cli\u003EFor slew rate: \u003Cmarimo-tex class=\"arithmatex\"\u003E||(-\\Delta u_{max} \\le u_i - u_{i-1} \\le \\Delta u_{max}||)\u003C/marimo-tex\u003E\u003C/li\u003E\n\u003C/ul\u003E\n\u003Cspan class=\"paragraph\"\u003E\u003Cstrong\u003ED. The Soft Constraints (Inequalities for Priorities 2 \u0026amp; 3):\u003C/strong\u003E\u003C/span\u003E\n\u003Cspan class=\"paragraph\"\u003EThe \u003Cmarimo-tex class=\"arithmatex\"\u003E||(G||)\u003C/marimo-tex\u003E matrix connects the states to the slack variables to enforce humidity bounds.\u003C/span\u003E\n\u003Cul\u003E\n\u003Cli\u003E\u003Cmarimo-tex class=\"arithmatex\"\u003E||(C_{in, i} - \\epsilon_{c,i} \\le 1000||)\u003C/marimo-tex\u003E  (Lower bound: \u003Cmarimo-tex class=\"arithmatex\"\u003E||(-\\infty||)\u003C/marimo-tex\u003E, Upper bound: \u003Cmarimo-tex class=\"arithmatex\"\u003E||(1000||)\u003C/marimo-tex\u003E)\u003C/li\u003E\n\u003Cli\u003E\u003Cmarimo-tex class=\"arithmatex\"\u003E||(W_{in, i} - \\epsilon_{w,i} \\le W_{max}||)\u003C/marimo-tex\u003E (Lower bound: \u003Cmarimo-tex class=\"arithmatex\"\u003E||(-\\infty||)\u003C/marimo-tex\u003E, Upper bound: \u003Cmarimo-tex class=\"arithmatex\"\u003E||(W_{max}||)\u003C/marimo-tex\u003E)\u003C/li\u003E\n\u003Cli\u003E\u003Cmarimo-tex class=\"arithmatex\"\u003E||(\\epsilon_{c,i} \\ge 0||)\u003C/marimo-tex\u003E and \u003Cmarimo-tex class=\"arithmatex\"\u003E||(\\epsilon_{w,i} \\ge 0||)\u003C/marimo-tex\u003E (Lower bound: 0, Upper bound: \u003Cmarimo-tex class=\"arithmatex\"\u003E||(+\\infty||)\u003C/marimo-tex\u003E)\u003C/li\u003E\n\u003C/ul\u003E\u003C/span\u003E"}, "type": "data"}]}, {"code_hash": "e7d8e58c37a4e07312edf7d567c514f0", "console": [], "id": "aLJB", "outputs": [{"data": {"text/markdown": "\u003Cspan class=\"markdown prose dark:prose-invert contents\"\u003E\u003Ch3 id=\"final-execution-loop\"\u003EFinal Execution Loop\u003C/h3\u003E\u003C/span\u003E"}, "type": "data"}]}, {"code_hash": "892daae63d42fc146ae900dfc13f9c2e", "console": [], "id": "nHfw", "outputs": [{"data": {"text/markdown": "\u003Cspan class=\"markdown prose dark:prose-invert contents\"\u003E\u003Col\u003E\n\u003Cli\u003ETimer Interrupt (\u003Cmarimo-tex class=\"arithmatex\"\u003E||(t = k T_s||)\u003C/marimo-tex\u003E)\u003C/li\u003E\n\u003Cli\u003ERead sensors and run the EKF to get \u003Cmarimo-tex class=\"arithmatex\"\u003E||(\\hat{x}_{k|k}||)\u003C/marimo-tex\u003E and \u003Cmarimo-tex class=\"arithmatex\"\u003E||(\\hat{d}_{k|k}||)\u003C/marimo-tex\u003E.\u003C/li\u003E\n\u003Cli\u003ECalculate \u003Cmarimo-tex class=\"arithmatex\"\u003E||(A_d, B_d, c_d||)\u003C/marimo-tex\u003E (Successive Linearization).\u003C/li\u003E\n\u003Cli\u003ESolve the \u003Cmarimo-tex class=\"arithmatex\"\u003E||(5 \\times 5||)\u003C/marimo-tex\u003E Target Selector matrix for \u003Cmarimo-tex class=\"arithmatex\"\u003E||(x_{ss}, u_{ss}||)\u003C/marimo-tex\u003E.\u003C/li\u003E\n\u003Cli\u003EUpdate the QP\u003C/li\u003E\n\u003Cli\u003ERun QP Solver\u003C/li\u003E\n\u003Cli\u003EExtract \u003Cmarimo-tex class=\"arithmatex\"\u003E||(U[0]||)\u003C/marimo-tex\u003E\u003C/li\u003E\n\u003Cli\u003ESet Output\u003C/li\u003E\n\u003C/ol\u003E\u003C/span\u003E"}, "type": "data"}]}], "metadata": {"marimo_version": "0.23.0", "script_metadata_hash": null}, "version": "1"},
            "runtimeConfig": null,
        };
    </script>
