      function __resizeIframe(obj) {
        const scrollbarHeight = 20; // Max between windows, mac, and linux

        function setHeight() {
          // Guard against race condition where iframe isn't ready
          if (!obj.contentWindow?.document?.documentElement) {
            return;
          }
          const element = obj.contentWindow.document.documentElement;
          // If there is no vertical scrollbar, we don't need to resize the iframe
          if (element.scrollHeight === element.clientHeight) {
            return;
          }

          // Create a new height that includes the scrollbar height if it's visible
          const hasHorizontalScrollbar = element.scrollWidth > element.clientWidth;
          const newHeight = element.scrollHeight + (hasHorizontalScrollbar ? scrollbarHeight : 0);

          // Only update the height if it's different from the current height
          if (obj.style.height !== `${newHeight}px`) {
            obj.style.height = `${newHeight}px`;
          }
        }

        // Resize the iframe to the height of the content and bottom scrollbar height
        setHeight();

        // Resize the iframe when the content changes
        const resizeObserver = new ResizeObserver((_entries) => {
          setHeight();
        });
        // Only observe if iframe content is ready
        if (obj.contentWindow?.document?.body) {
          resizeObserver.observe(obj.contentWindow.document.body);
        }
      }
    </script>

            "session": {"cells": [{"code_hash": "3073439fadcf690ce6b9a0a15f246093", "console": [], "id": "Hbol", "outputs": [{"data": {"text/html": "\u003Cstyle\u003E/* Load fonts from Google Fonts */\n@import url(\"https://fonts.googleapis.com/css2?family=Inter:opsz,wght@14..32,300..800\u0026family=Fira+Code:wght@300..700\u0026display=swap\");\n\n/* Font and Radius Variables */\n:root {\n    --monospace-font: \"Fira Code\", monospace;\n    --text-font: \"Inter\", system-ui, -apple-system, \"Segoe UI\", \"Roboto\", \"Open Sans\", sans-serif;\n    --heading-font: \"Inter\", system-ui, -apple-system, \"Segoe UI\", \"Roboto\", \"Open Sans\", sans-serif;\n    --radius: 12px;\n}\n\n/* Mininini Theme Colors */\n:root {\n    /* Backgrounds - soft, not pure black */\n    --background: light-dark(#ffffff, #181a1c);\n    --background-darker: light-dark(#e5e5e5, #101214);\n    --foreground: light-dark(#0a0a0a, #eef2f5);\n    --muted: light-dark(#f0f0f0, #222528);\n    --muted-foreground: light-dark(#777777, #9aa3ae);\n\n    /* UI Elements */\n    --card: light-dark(#fafafa, #1e2124);\n    --card-foreground: light-dark(#222222, #eef2f5);\n    --popover: light-dark(#e8e8e8, #181a1c);\n    --popover-foreground: light-dark(#0f0f0f, #eef2f5);\n    --border: light-dark(#444444, #2e3236);\n    --input: light-dark(#f5f5f5, #131517);\n\n    /* Primary Colors */\n    --primary: light-dark(#1e40af, #3b82f6);\n    --primary-foreground: light-dark(#ffffff, #ffffff);\n    --secondary: light-dark(#475569, #6c7a91);\n    --secondary-foreground: light-dark(#ffffff, #f1f5f9);\n    --accent: light-dark(#f97316, #fb923c);\n    --accent-foreground: light-dark(#ffffff, #ffffff);\n\n    /* Heading Colors - All gray except H4 (orange) and H5 (blue) */\n    --h1-color: light-dark(#1f2937, #e5e7eb); /* Gray */\n    --h2-color: light-dark(#374151, #d1d5db); /* Gray */\n    --h3-color: light-dark(#4b5563, #9ca3af); /* Gray */\n    --h4-color: light-dark(#ea580c, #f97316); /* Orange accent */\n    --h5-color: light-dark(#2563eb, #60a5fa); /* Blue accent */\n    --h6-color: light-dark(#6b7280, #9ca3af); /* Gray (lighter) */\n\n    /* Code \u0026 Math Styling */\n    --inline-code-color: light-dark(#2563eb, #60a5fa);\n    --equation-color: light-dark(#6b7280, #9ca3af);\n\n    /* Semantic Colors */\n    --error: light-dark(#dc2626, #f87171);\n    --success: light-dark(#059669, #34d399);\n    --destructive: light-dark(#b91c1c, #ef4444);\n    --action: light-dark(#d97706, #fbbf24);\n    --link: light-dark(#2563eb, #3b82f6);\n    --link-visited: light-dark(#7c3aed, #a78bfa);\n\n    /* Shadows */\n    --base-shadow: light-dark(rgba(0, 0, 0, 0.08), rgba(0, 0, 0, 0.3));\n    --base-shadow-darker: light-dark(rgba(0, 0, 0, 0.12), rgba(0, 0, 0, 0.4));\n    --base-shadow-opacity: 8%;\n}\n\n/* Heading styles */\nh1, .h1 { \n    color: var(--h1-color); \n    font-weight: 800;\n    letter-spacing: -0.02em;\n}\n\nh2, .h2 { \n    color: var(--h2-color); \n    font-weight: 700;\n    letter-spacing: -0.01em;\n}\n\nh3, .h3 { \n    color: var(--h3-color); \n    font-weight: 600;\n}\n\nh4, .h4 { \n    color: var(--h4-color); /* Orange */\n    font-weight: 600; \n    letter-spacing: -0.01em; \n}\n\nh5, .h5 { \n    color: var(--h5-color); /* Blue */\n    font-weight: 500;\n}\n\nh6, .h6 { \n    color: var(--h6-color); /* Gray */\n    font-weight: 500;\n}\n\n/* Inline code styling - Blue */\ncode:not(pre code), .inline-code {\n    color: var(--inline-code-color);\n    font-family: var(--monospace-font);\n    background-color: var(--muted);\n    padding: 0.2em 0.4em;\n    border-radius: 6px;\n    font-size: 1.0em;\n    font-weight: 500;\n}\n\n/* Equation styling - Gray */\nmarimo-tex,\n.arithmatex,\n.marimo-tex,\n.katex,\n.katex *,\n.mjx-container,\nmjx-container,\n.math {\n    color: var(--equation-color) !important;\n    font-size: 1.0em;\n}\n\nmarimo-tex mjx-container,\nmarimo-tex .MathJax,\nmarimo-tex [class*=\"math\"] {\n    color: var(--equation-color) !important;\n    font-size: 1.0em;\n}\n\n.latex,\n.latex *,\n.tex,\n.tex * {\n    color: var(--equation-color) !important;\n    font-size: 1.0em;\n}\n\n/* Code blocks subtle blue tint */\npre code {\n    background-color: var(--background-darker);\n    border-left: 3px solid var(--primary);\n    font-size: 1.0em;\n}\n\n.markdown marimo-tex,\n.prose marimo-tex {\n    color: var(--equation-color) !important;\n    font-size: 1.0em;\n}\n\n/* =========================================\n   Global Table Styling (Marimo \"Nuclear\" Override)\n   ========================================= */\n\n/* Target the table container aggressively */\n:root body [class*=\"prose\"] table,\nmarimo-markdown table {\n    width: 100% !important;\n    border-collapse: collapse !important;\n    margin: 1.5em 0 !important;\n}\n\n/* Force Header Styles */\n:root body [class*=\"prose\"] th,\nmarimo-markdown th {\n    padding: 12px 16px !important;\n    border-bottom: 2px solid var(--border) !important;\n    color: var(--h3-color) !important;\n    font-weight: 600 !important;\n    background-color: transparent !important;\n    text-align: left !important;\n}\n\n/* Base Cell Styles */\n:root body [class*=\"prose\"] td,\nmarimo-markdown td {\n    padding: 12px 16px !important;\n    border-bottom: 1px solid var(--border) !important;\n    color: var(--foreground) !important;\n}\n\n/* Zebra Striping - Applied directly to the TD so Marimo can't cover it up */\n:root body [class*=\"prose\"] tbody tr:nth-child(odd) td,\nmarimo-markdown tbody tr:nth-child(odd) td {\n    background-color: var(--muted) !important;\n}\n\n:root body [class*=\"prose\"] tbody tr:nth-child(even) td,\nmarimo-markdown tbody tr:nth-child(even) td {\n    background-color: transparent !important;\n}\n\n/* Hover effect - Also applied to the TD */\n:root body [class*=\"prose\"] tbody tr:hover td,\nmarimo-markdown tbody tr:hover td {\n    background-color: var(--background-darker) !important;\n}\n\u003C/style\u003E"}, "type": "data"}]}, {"code_hash": "93bd30689fae3b36066903a71d4868bc", "console": [], "id": "fRBU", "outputs": [{"data": {"text/markdown": "\u003Cspan class=\"markdown prose dark:prose-invert contents\"\u003E\u003Cblockquote\u003E\u003C/blockquote\u003E\u003C/span\u003E"}, "type": "data"}]}, {"code_hash": "fc06233a2efbe664d3542d57dcd19a84", "console": [], "id": "yGeD", "outputs": [{"data": {"text/markdown": "\u003Cspan class=\"markdown prose dark:prose-invert contents\"\u003E\u003Ch1 id=\"design-and-validation-of-a-scalable-decentralized-control-architecture-for-multi-zone-hvac-systems\"\u003E\u003Cstrong\u003EDesign and Validation of a Scalable Decentralized Control Architecture for Multi-Zone HVAC Systems\u003C/strong\u003E\u003C/h1\u003E\u003C/span\u003E"}, "type": "data"}]}, {"code_hash": "07d071afad9006f93be1bf4edc19ac2e", "console": [], "id": "vJEW", "outputs": [{"data": {"text/markdown": "\u003Cspan class=\"markdown prose dark:prose-invert contents\"\u003E\u003Cblockquote\u003E\n\u003Cspan class=\"paragraph\"\u003E\u003Cstrong\u003EProject by:\u003C/strong\u003E Yapa W.S.P.Y.J.C. (E/20/452)\u003C/span\u003E\n\u003Cspan class=\"paragraph\"\u003E\u003Cstrong\u003ESupervisor:\u003C/strong\u003E Dr. D. H. S. Maithripala\u003C/span\u003E\n\u003Cspan class=\"paragraph\"\u003E\u003Cstrong\u003EInstitution:\u003C/strong\u003E Department of Mechanical Engineering, University of Peradeniya\u003C/span\u003E\n\u003C/blockquote\u003E\u003C/span\u003E"}, "type": "data"}]}, {"code_hash": "d87647ab0c5303e6f95d8b74306a0c90", "console": [], "id": "sHCz", "outputs": [{"data": {"text/markdown": "\u003Cspan class=\"markdown prose dark:prose-invert contents\"\u003E\u003Ch2 id=\"project-overview\"\u003EProject Overview\u003C/h2\u003E\u003C/span\u003E"}, "type": "data"}]}, {"code_hash": "64a48aa6f790f4df46d8e0c51b9a28d8", "console": [], "id": "Ixym", "outputs": [{"data": {"text/markdown": "\u003Cspan class=\"markdown prose dark:prose-invert contents\"\u003E\u003Cspan class=\"paragraph\"\u003EThis project focuses on designing a scalable, modular, and decentralized control architecture to manage the thermal and operational coupling inherent in multi-zone buildings. By moving away from purely centralized systems, this architecture aims to improve scalability and energy efficiency while maintaining high standards for Indoor Air Quality (IAQ) and human comfort.\u003C/span\u003E\u003C/span\u003E"}, "type": "data"}]}, {"code_hash": "f8cb60f6f2745062819ed3936642d56a", "console": [], "id": "NEzS", "outputs": [{"data": {"text/markdown": "\u003Cspan class=\"markdown prose dark:prose-invert contents\"\u003E\u003Ch2 id=\"key-objectives\"\u003EKey Objectives\u003C/h2\u003E\u003C/span\u003E"}, "type": "data"}]}, {"code_hash": "8f53d008cd61d424b1a7658b825301da", "console": [], "id": "yKHn", "outputs": [{"data": {"text/markdown": "\u003Cspan class=\"markdown prose dark:prose-invert contents\"\u003E\u003Cul\u003E\n\u003Cli\u003E\u003Cstrong\u003EModeling\u003C/strong\u003E: Implement xR2C thermal zone modeling derived from 3R2C standards, utilizing an automated pipeline to extract data from EnergyPlus (.idf) files.  \u003C/li\u003E\n\u003Cli\u003E\u003Cstrong\u003EEstimation\u003C/strong\u003E: Utilize an Augmented Extended Kalman Filter (EKF) to reconstruct hidden thermal mass states and estimate unmodeled disturbances for soft-sensing occupancy.\u003C/li\u003E\n\u003Cli\u003E\u003Cstrong\u003EControl\u003C/strong\u003E: Deploy Model Predictive Control (MPC) to manage underactuated systems, prioritizing temperature tracking while maintaining humidity and CO2\u200b within comfort bounds.  \u003C/li\u003E\n\u003Cli\u003E\u003Cstrong\u003EValidation\u003C/strong\u003E: Verify the architecture through high-fidelity EnergyPlus simulations and a digitized bench-scale single-zone testbed.\u003C/li\u003E\n\u003C/ul\u003E\u003C/span\u003E"}, "type": "data"}]}, {"code_hash": "11c01743f83865768f957abbbdc901fe", "console": [], "id": "FyOq", "outputs": [{"data": {"text/markdown": "\u003Cspan class=\"markdown prose dark:prose-invert contents\"\u003E\u003Ch2 id=\"navigation-documentation\"\u003ENavigation \u0026amp; Documentation\u003C/h2\u003E\u003C/span\u003E"}, "type": "data"}]}, {"code_hash": "b2919131d7e5c065b8bd56caf06029a3", "console": [], "id": "cKyo", "outputs": [{"data": {"text/markdown": "\u003Cspan class=\"markdown prose dark:prose-invert contents\"\u003E\u003Cspan class=\"paragraph\"\u003E\u003Ca href=\"https://janithcyapa.github.io/DHCA-Framework/\" rel=\"noopener noreferrer\" target=\"_blank\"\u003E\ud83c\udfe0 Home\u003C/a\u003E \u003C/span\u003E\n\u003Cspan class=\"paragraph\"\u003E\u003Ca href=\"https://janithcyapa.github.io/DHCA-Framework/1.Thermal_Zone_Modeling.html\" rel=\"noopener noreferrer\" target=\"_blank\"\u003E\ud83d\udcd1 1.Thermal Zone Modeling\u003C/a\u003E\u003C/span\u003E\n\u003Cspan class=\"paragraph\"\u003E\u003Ca href=\"https://janithcyapa.github.io/DHCA-Framework/2.State_Estimator_Design.html\" rel=\"noopener noreferrer\" target=\"_blank\"\u003E\ud83d\udcd1 2.State Estimator Design\u003C/a\u003E\u003C/span\u003E\n\u003Cspan class=\"paragraph\"\u003E\u003Ca href=\"https://janithcyapa.github.io/DHCA-Framework/3.MPC_Design.html\" rel=\"noopener noreferrer\" target=\"_blank\"\u003E\ud83d\udcd1 3.MPC Design\u003C/a\u003E\u003C/span\u003E\n\u003Ch3 id=\"usefull-links\"\u003EUsefull Links\u003C/h3\u003E\n\u003Cspan class=\"paragraph\"\u003E\u003Ca href=\"https://github.com/janithcyapa/DHCA-Framework\" rel=\"noopener noreferrer\" target=\"_blank\"\u003E\ud83d\uddc2\ufe0f GitHub Repository\u003C/a\u003E\u003C/span\u003E\n\u003Cspan class=\"paragraph\"\u003E\u003Ca href=\"https://github.com/janithcyapa/energy-plus-utility\" rel=\"noopener noreferrer\" target=\"_blank\"\u003E\ud83d\uddc2\ufe0f EnergyPlus Util\u003C/a\u003E\u003C/span\u003E\n\u003Cspan class=\"paragraph\"\u003E\u003Ca href=\"https://github.com/janithcyapa/MechLabs_AHU\" rel=\"noopener noreferrer\" target=\"_blank\"\u003E\ud83d\uddc2\ufe0f Test Bench Docs\u003C/a\u003E\u003C/span\u003E\u003C/span\u003E"}, "type": "data"}]}], "metadata": {"marimo_version": "0.23.0", "script_metadata_hash": null}, "version": "1"},
