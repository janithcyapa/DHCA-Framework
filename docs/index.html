      function __resizeIframe(obj) {
        const scrollbarHeight = 20; // Max between windows, mac, and linux

        function setHeight() {
          // Guard against race condition where iframe isn't ready
          if (!obj.contentWindow?.document?.documentElement) {
            return;
          }
          const element = obj.contentWindow.document.documentElement;
          // If there is no vertical scrollbar, we don't need to resize the iframe
          if (element.scrollHeight === element.clientHeight) {
            return;
          }

          // Create a new height that includes the scrollbar height if it's visible
          const hasHorizontalScrollbar = element.scrollWidth > element.clientWidth;
          const newHeight = element.scrollHeight + (hasHorizontalScrollbar ? scrollbarHeight : 0);

          // Only update the height if it's different from the current height
          if (obj.style.height !== `${newHeight}px`) {
            obj.style.height = `${newHeight}px`;
          }
        }

        // Resize the iframe to the height of the content and bottom scrollbar height
        setHeight();

        // Resize the iframe when the content changes
        const resizeObserver = new ResizeObserver((_entries) => {
          setHeight();
        });
        // Only observe if iframe content is ready
        if (obj.contentWindow?.document?.body) {
          resizeObserver.observe(obj.contentWindow.document.body);
        }
      }
    </script>

            "session": {"cells": [{"code_hash": "3073439fadcf690ce6b9a0a15f246093", "console": [], "id": "Hbol", "outputs": []}, {"code_hash": "f98156f135185dc89add5bc3406b196c", "console": [], "id": "MJUe", "outputs": [{"data": {"text/markdown": "\u003Cspan class=\"markdown prose dark:prose-invert contents\"\u003E\u003Cblockquote\u003E\u003C/blockquote\u003E\u003C/span\u003E"}, "type": "data"}]}, {"code_hash": "fc06233a2efbe664d3542d57dcd19a84", "console": [], "id": "vblA", "outputs": [{"data": {"text/markdown": "\u003Cspan class=\"markdown prose dark:prose-invert contents\"\u003E\u003Ch1 id=\"design-and-validation-of-a-scalable-decentralized-control-architecture-for-multi-zone-hvac-systems\"\u003E\u003Cstrong\u003EDesign and Validation of a Scalable Decentralized Control Architecture for Multi-Zone HVAC Systems\u003C/strong\u003E\u003C/h1\u003E\u003C/span\u003E"}, "type": "data"}]}, {"code_hash": "07d071afad9006f93be1bf4edc19ac2e", "console": [], "id": "bkHC", "outputs": [{"data": {"text/markdown": "\u003Cspan class=\"markdown prose dark:prose-invert contents\"\u003E\u003Cblockquote\u003E\n\u003Cspan class=\"paragraph\"\u003E\u003Cstrong\u003EProject by:\u003C/strong\u003E Yapa W.S.P.Y.J.C. (E/20/452)\u003C/span\u003E\n\u003Cspan class=\"paragraph\"\u003E\u003Cstrong\u003ESupervisor:\u003C/strong\u003E Dr. D. H. S. Maithripala\u003C/span\u003E\n\u003Cspan class=\"paragraph\"\u003E\u003Cstrong\u003EInstitution:\u003C/strong\u003E Department of Mechanical Engineering, University of Peradeniya\u003C/span\u003E\n\u003C/blockquote\u003E\u003C/span\u003E"}, "type": "data"}]}, {"code_hash": "d87647ab0c5303e6f95d8b74306a0c90", "console": [], "id": "lEQa", "outputs": [{"data": {"text/markdown": "\u003Cspan class=\"markdown prose dark:prose-invert contents\"\u003E\u003Ch2 id=\"project-overview\"\u003EProject Overview\u003C/h2\u003E\u003C/span\u003E"}, "type": "data"}]}, {"code_hash": "64a48aa6f790f4df46d8e0c51b9a28d8", "console": [], "id": "PKri", "outputs": [{"data": {"text/markdown": "\u003Cspan class=\"markdown prose dark:prose-invert contents\"\u003E\u003Cspan class=\"paragraph\"\u003EThis project focuses on designing a scalable, modular, and decentralized control architecture to manage the thermal and operational coupling inherent in multi-zone buildings. By moving away from purely centralized systems, this architecture aims to improve scalability and energy efficiency while maintaining high standards for Indoor Air Quality (IAQ) and human comfort.\u003C/span\u003E\u003C/span\u003E"}, "type": "data"}]}, {"code_hash": "f8cb60f6f2745062819ed3936642d56a", "console": [], "id": "Xref", "outputs": [{"data": {"text/markdown": "\u003Cspan class=\"markdown prose dark:prose-invert contents\"\u003E\u003Ch2 id=\"key-objectives\"\u003EKey Objectives\u003C/h2\u003E\u003C/span\u003E"}, "type": "data"}]}, {"code_hash": "ef607c10b6ea33d56fec240da301fa7e", "console": [], "id": "SFPL", "outputs": [{"data": {"text/markdown": "\u003Cspan class=\"markdown prose dark:prose-invert contents\"\u003E\u003Cul\u003E\n\u003Cli\u003E\u003Cstrong\u003EModeling\u003C/strong\u003E: Implement xR2C thermal zone modeling derived from 3R2C standards, utilizing an automated pipeline to extract data from EnergyPlus (.idf) files.\u003C/li\u003E\n\u003Cli\u003E\u003Cstrong\u003EEstimation\u003C/strong\u003E: Utilize an Augmented Extended Kalman Filter (EKF) to reconstruct hidden thermal mass states and estimate unmodeled disturbances for soft-sensing occupancy.\u003C/li\u003E\n\u003Cli\u003E\u003Cstrong\u003EControl\u003C/strong\u003E: Deploy Model Predictive Control (MPC) to manage underactuated systems, prioritizing temperature tracking while maintaining humidity and CO2\u200b within comfort bounds.\u003C/li\u003E\n\u003Cli\u003E\u003Cstrong\u003EValidation\u003C/strong\u003E: Verify the architecture through high-fidelity EnergyPlus simulations and a digitized bench-scale single-zone testbed.\u003C/li\u003E\n\u003C/ul\u003E\u003C/span\u003E"}, "type": "data"}]}, {"code_hash": "11c01743f83865768f957abbbdc901fe", "console": [], "id": "BYtC", "outputs": [{"data": {"text/markdown": "\u003Cspan class=\"markdown prose dark:prose-invert contents\"\u003E\u003Ch2 id=\"navigation-documentation\"\u003ENavigation \u0026amp; Documentation\u003C/h2\u003E\u003C/span\u003E"}, "type": "data"}]}, {"code_hash": "bdc4b0dcc9dcd766d26b0c5de88a6b90", "console": [], "id": "RGSE", "outputs": [{"data": {"text/markdown": "\u003Cspan class=\"markdown prose dark:prose-invert contents\"\u003E\u003Cspan class=\"paragraph\"\u003E\u003Ca href=\"https://janithcyapa.github.io/DHCA-Framework/\" rel=\"noopener noreferrer\" target=\"_blank\"\u003E\ud83c\udfe0 Home\u003C/a\u003E\u003C/span\u003E\n\u003Cspan class=\"paragraph\"\u003E\u003Ca href=\"https://janithcyapa.github.io/DHCA-Framework/1.Thermal_Zone_Modeling.html\" rel=\"noopener noreferrer\" target=\"_blank\"\u003E\ud83d\udcd1 1.Thermal Zone Modeling\u003C/a\u003E\u003C/span\u003E\n\u003Cspan class=\"paragraph\"\u003E\u003Ca href=\"https://janithcyapa.github.io/DHCA-Framework/2.State_Estimator_Design.html\" rel=\"noopener noreferrer\" target=\"_blank\"\u003E\ud83d\udcd1 2.State Estimator Design\u003C/a\u003E\u003C/span\u003E\n\u003Cspan class=\"paragraph\"\u003E\u003Ca href=\"https://janithcyapa.github.io/DHCA-Framework/3.MPC_Design.html\" rel=\"noopener noreferrer\" target=\"_blank\"\u003E\ud83d\udcd1 3.MPC Design\u003C/a\u003E\u003C/span\u003E\n\u003Ch3 id=\"usefull-links\"\u003EUsefull Links\u003C/h3\u003E\n\u003Cspan class=\"paragraph\"\u003E\u003Ca href=\"https://github.com/janithcyapa/DHCA-Framework\" rel=\"noopener noreferrer\" target=\"_blank\"\u003E\ud83d\uddc2\ufe0f GitHub Repository\u003C/a\u003E\u003C/span\u003E\n\u003Cspan class=\"paragraph\"\u003E\u003Ca href=\"https://github.com/janithcyapa/energy-plus-utility\" rel=\"noopener noreferrer\" target=\"_blank\"\u003E\ud83d\uddc2\ufe0f EnergyPlus Util\u003C/a\u003E\u003C/span\u003E\n\u003Cspan class=\"paragraph\"\u003E\u003Ca href=\"https://github.com/janithcyapa/MechLabs_AHU\" rel=\"noopener noreferrer\" target=\"_blank\"\u003E\ud83d\uddc2\ufe0f Test Bench Docs\u003C/a\u003E\u003C/span\u003E\u003C/span\u003E"}, "type": "data"}]}], "metadata": {"marimo_version": "0.23.0", "script_metadata_hash": null}, "version": "1"},
